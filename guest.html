<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach L Radio – Guest Studio</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:#fff; font-family:'Segoe UI', system-ui, sans-serif; overflow-y:auto; scroll-snap-type:y mandatory; }
    
    /* Gated Entry */
    #lockScreen { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:9999; }
    .lock-box { background:#111; padding:40px; border-radius:24px; text-align:center; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .lock-box input { display:block; width:100%; padding:15px; margin:20px 0; background:#222; border:none; color:#fff; border-radius:12px; text-align:center; }
    .lock-box button { width:100%; padding:15px; border-radius:12px; border:none; background:#e53935; color:#fff; font-weight:bold; cursor:pointer; }

    /* Layout */
    .section { height:100vh; width:100%; scroll-snap-align:start; position:relative; overflow:hidden; background:#000; }
    iframe { width:100%; height:100%; border:none; }

    /* Video Player (Section 2) */
    .broadcast-container { position:relative; width:100%; height:100%; background:#050505; display:flex; align-items:center; justify-content:center; }
    
    /* Main Video Feed - Filling the space like Jitsi */
    #mainDisplay { width:100%; height:100%; object-fit: cover; background:#000; transition: transform 0.5s ease; }
    .portrait { object-fit: contain !important; transform: scale(0.9); }

    /* Floating UI Controls */
    .overlay-controls { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:10; background:rgba(0,0,0,0.6); padding:10px 20px; border-radius:50px; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); }
    .overlay-controls button { background:none; border:none; color:#fff; cursor:pointer; font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:1px; padding:10px; transition: 0.2s; }
    .overlay-controls button:hover { color:#ff3366; }
    .rec-active { color:#ff3366 !important; animation: pulse 1.5s infinite; }

    /* Notification Bell & Chat */
    #chatToggle { position:absolute; top:30px; right:30px; font-size:24px; cursor:pointer; z-index:15; background:rgba(229,57,53,0.2); width:50px; height:50px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:0.3s; }
    #chatToggle.has-new::after { content:''; position:absolute; top:12px; right:12px; width:10px; height:10px; background:#00ff88; border-radius:50%; }
    
    #chatPanel { position:absolute; top:90px; right:30px; width:320px; height:450px; background:rgba(15,15,15,0.95); border:1px solid #333; border-radius:16px; display:none; flex-direction:column; z-index:14; backdrop-filter:blur(20px); overflow:hidden; }
    #chatMsgs { flex:1; overflow-y:auto; padding:15px; font-size:14px; line-height:1.6; }
    .chat-input { display:flex; padding:10px; background:#222; }
    .chat-input input { flex:1; background:none; border:none; color:#fff; padding:10px; outline:none; }

    #signalBox { position:absolute; bottom:100px; left:50%; transform:translateX(-50%); width:300px; height:40px; background:rgba(0,0,0,0.8); border:1px solid #444; color:#00ff88; font-size:10px; border-radius:8px; padding:10px; opacity:0.5; transition:0.3s; z-index:5; }
    #signalBox:focus { opacity:1; height:100px; }

    @keyframes pulse { 0% { opacity:1; } 50% { opacity:0.3; } 100% { opacity:1; } }

    /* EXIT BUTTON */
    #exitBtn {
        position:fixed; bottom:24px; right:24px;
        background:#ff3366; color:#fff; padding:12px 24px;
        border-radius:30px; font-weight:900; cursor:pointer;
        z-index:9998; border:none; font-size:14px; letter-spacing:1px;
        box-shadow:0 4px 20px rgba(255,51,102,0.4);
    }
    #exitBtn:hover { opacity:0.85; }
</style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-box">
        <h2>🎤 GUEST STUDIO</h2>
        <input type="text" id="gUser" placeholder="USERNAME" onkeydown="if(event.key==='Enter') unlock()" style="display:block;width:100%;padding:15px;margin:20px 0 8px;background:#222;border:none;color:#fff;border-radius:12px;text-align:center;font-size:16px;">
        <input type="password" id="gPass" placeholder="PASSWORD" onkeydown="if(event.key==='Enter') unlock()" style="display:block;width:100%;padding:15px;margin:0 0 12px;background:#222;border:none;color:#fff;border-radius:12px;text-align:center;font-size:16px;">
        <div id="unlockErr" style="color:#ff6666;font-size:12px;margin-bottom:8px;display:none;">Invalid username or password</div>
        <button onclick="unlock()">ENTER STUDIO</button>
    </div>
</div>

<section class="section">
    <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/dj" allow="microphone; autoplay"></iframe>
</section>

<section class="section">
    <div class="broadcast-container">
        <div id="chatToggle" onclick="toggleChat()">🔔</div>
        
        <div id="chatPanel">
            <div id="chatMsgs"></div>
            <div class="chat-input">
                <input type="text" id="msgIn" placeholder="Reply to Guest...">
                <button onclick="sendMsg()" style="background:none; border:none; color:#e53935; font-weight:bold;">SEND</button>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="statusBar" style="
            display:none; position:absolute; top:20px; left:50%; transform:translateX(-50%);
            background:rgba(0,255,136,0.15); border:1px solid rgba(0,255,136,0.3);
            color:#00ff88; padding:8px 20px; border-radius:30px; font-size:12px;
            font-weight:700; text-transform:uppercase; letter-spacing:1px; z-index:30;
            white-space:nowrap; pointer-events:none;
        "></div>

        <!-- Camera not ready message -->
        <div id="camMsg" style="
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            text-align:center; z-index:5; pointer-events:none;
        ">
            <div style="font-size:60px;margin-bottom:16px;">📷</div>
            <div style="font-size:18px;font-weight:700;margin-bottom:8px;">Camera Not Active</div>
            <div style="font-size:13px;color:#666;">Enter your password to start the studio.<br>Your browser will ask for camera & mic permission.</div>
        </div>

        <video id="mainDisplay" autoplay playsinline muted style="display:none;"></video>

        <!-- PASSKEY PANEL -->
        <div id="passkeyPanel" style="
            position:absolute; bottom:110px; left:50%; transform:translateX(-50%);
            width:min(480px,90vw); background:rgba(10,10,10,0.95);
            border:1px solid rgba(255,255,255,0.15); border-radius:16px;
            backdrop-filter:blur(20px); z-index:20; display:none; overflow:hidden;
        ">
            <!-- Header -->
            <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.08);">
                <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">🔗 Guest Connection</div>
                <button onclick="document.getElementById('passkeyPanel').style.display='none'" style="background:none;border:none;color:#666;font-size:20px;cursor:pointer;line-height:1;">×</button>
            </div>
            <!-- STEP 1: Your offer key -->
            <div style="padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.06);">
                <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:8px;">Step 1 — Copy this key and send to your guest</div>
                <div style="position:relative;">
                    <textarea id="signalBox" readonly placeholder="Click Go Live first to generate your key..." style="
                        width:100%; height:70px; background:rgba(255,255,255,0.05);
                        border:1px solid rgba(255,255,255,0.1); border-radius:8px;
                        color:#00ff88; font-size:10px; padding:10px 40px 10px 10px;
                        font-family:monospace; resize:none; line-height:1.4;
                    "></textarea>
                    <button onclick="copyKey()" id="copyBtn" style="
                        position:absolute; top:8px; right:8px;
                        background:rgba(0,255,136,0.15); border:1px solid rgba(0,255,136,0.3);
                        color:#00ff88; border-radius:6px; padding:6px 10px;
                        font-size:10px; font-weight:700; cursor:pointer; transition:0.2s;
                        text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap;
                    ">📋 Copy</button>
                    <button onclick="shareKeyOnline()" id="shareBtn" style="
                        position:absolute; top:8px; right:75px;
                        background:rgba(229,57,53,0.2); border:1px solid rgba(229,57,53,0.4);
                        color:#ff4b2b; border-radius:6px; padding:6px 10px;
                        font-size:10px; font-weight:700; cursor:pointer; transition:0.2s;
                        text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap;
                    ">🔴 Share Live</button>
                </div>
            </div>
            <!-- STEP 2: Paste guest answer key -->
            <div style="padding:16px 18px;">
                <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:8px;">Step 2 — Paste the key your guest sends back</div>
                <div style="position:relative;">
                    <textarea id="guestAnswerBox" placeholder="Paste guest answer key here..." style="
                        width:100%; height:70px; background:rgba(255,255,255,0.05);
                        border:1px solid rgba(255,255,255,0.1); border-radius:8px;
                        color:#fff; font-size:10px; padding:10px; font-family:monospace;
                        resize:none; line-height:1.4; transition:0.3s;
                    "></textarea>
                </div>
                <button onclick="connectGuest()" style="
                    width:100%; margin-top:10px; padding:11px;
                    background:#e53935; border:none; border-radius:8px;
                    color:#fff; font-size:12px; font-weight:900;
                    text-transform:uppercase; letter-spacing:1px; cursor:pointer; transition:0.3s;
                ">⚡ Connect Guest</button>
                <div id="connectStatus" style="font-size:11px;color:#888;text-align:center;margin-top:8px;"></div>
            </div>
        </div>

        <div class="overlay-controls">
            <button onclick="toggleCam()">🔄 Switch Cam</button>
            <button onclick="startBroadcast()">📡 Go Live</button>
            <button onclick="togglePasskeyPanel()">🔗 Link Guest</button>
            <button id="recBtn" onclick="toggleRec()">⏺ Record</button>
            <button onclick="shareScreen()">🖥 Share Screen</button>
        </div>
    </div>
</section>

<section class="section">
    <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/schedule"></iframe>
</section>

<script>
let localStream, guestStream, peerConnection, dataChannel, mediaRecorder;
let recordedChunks = [];
let currentFacingMode = "user";

const mainDisplay = document.getElementById("mainDisplay");
const chatPanel = document.getElementById("chatPanel");
const chatToggle = document.getElementById("chatToggle");

// 1. UNLOCK LOGIC
const accounts = {
    GuestDJ1: "red",
    GuestDJ2: "blue",
    GuestDJ3: "yellow",
    GuestDJ4: "green",
    GuestDJ5: "orange"
};

let guestUsername = "";

function unlock() {
    const u = document.getElementById("gUser").value.trim();
    const p = document.getElementById("gPass").value.trim();
    if (accounts[u] && accounts[u] === p) {
        guestUsername = u;
        document.getElementById("lockScreen").style.display = "none";
        document.querySelectorAll(".section")[1].scrollIntoView({behavior:"smooth"});
        initMedia();
    } else {
        document.getElementById("unlockErr").style.display = "block";
        document.getElementById("gPass").value = "";
    }
}

// 2. CAMERA ENGINE (HD + TOGGLE)
async function initMedia() {
    try {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    
    // Auto-detect Orientation for Landscape vs Portrait
    // Try HD first, fall back to basic if device doesn't support it
    const tryConstraints = [
        { video: { facingMode: currentFacingMode, width:{ideal:1920}, height:{ideal:1080} }, audio: true },
        { video: { facingMode: currentFacingMode, width:{ideal:1280}, height:{ideal:720}  }, audio: true },
        { video: { facingMode: currentFacingMode }, audio: true },
        { video: true, audio: true }
    ];

    let gotStream = false;
    for (const c of tryConstraints) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia(c);
            gotStream = true;
            break;
        } catch(e) { continue; }
    }
    if (!gotStream) { showStatus("⚠ Camera access denied. Check browser permissions.", "error"); return; }

    mainDisplay.srcObject = localStream;
    mainDisplay.style.display = "block";
    document.getElementById("camMsg").style.display = "none";
    mainDisplay.play().catch(()=>{});
    if (currentFacingMode === "user") mainDisplay.classList.add("portrait");
    else mainDisplay.classList.remove("portrait");
    showStatus("✓ Camera active", "ok");
    } catch(err) {
        showStatus("⚠ Camera error: " + err.message, "error");
        console.error("initMedia error:", err);
    }
}

function toggleCam() {
    currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
    initMedia();
}

// Share screen — replaces camera feed with screen capture
async function shareScreen() {
    try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        // Keep mic audio from localStream, replace video with screen
        mainDisplay.srcObject = screenStream;
        screenStream.getVideoTracks()[0].onended = () => {
            // When user stops sharing, go back to camera
            if (localStream) mainDisplay.srcObject = localStream;
            showStatus("Screen share ended — camera restored", "ok");
        };
        showStatus("✓ Screen sharing active", "ok");
    } catch(e) {
        showStatus("⚠ Screen share cancelled or not supported", "error");
    }
}

// Status helper
function showStatus(msg, type) {
    const bar = document.getElementById("statusBar");
    if (!bar) return;
    bar.textContent = msg;
    bar.style.background = type === "error" ? "rgba(255,51,102,0.9)" : "rgba(0,255,136,0.15)";
    bar.style.borderColor = type === "error" ? "rgba(255,51,102,0.5)" : "rgba(0,255,136,0.3)";
    bar.style.color = type === "error" ? "#fff" : "#00ff88";
    bar.style.display = "block";
    setTimeout(() => bar.style.display = "none", 4000);
}

// 3. BROADCAST & GUEST LINKING
function createPeer() {
    peerConnection = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
    
    peerConnection.ontrack = (e) => {
        guestStream = e.streams[0];
        // In a pro setup, we'd overlay the guest, 
        // but for now, we switch the main display to the guest when they talk
        mainDisplay.srcObject = guestStream;
    };

    dataChannel = peerConnection.createDataChannel("chat");
    dataChannel.onmessage = e => {
        addChat("Guest: " + e.data);
        if(chatPanel.style.display !== "flex") chatToggle.classList.add("has-new");
    };

    peerConnection.onicecandidate = e => {
        if(!e.candidate) {
            const key = JSON.stringify(peerConnection.localDescription);
            document.getElementById("signalBox").value = key;
            document.getElementById("connectStatus").textContent = "✓ Key ready — copy and send to guest";
            document.getElementById("connectStatus").style.color = "#00ff88";
            document.getElementById("copyBtn").style.background = "rgba(0,255,136,0.25)";
        }
    };
}

async function startBroadcast() {
    createPeer();
    const o = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(o);
    // Show passkey panel automatically
    document.getElementById('passkeyPanel').style.display = 'block';
    document.getElementById('connectStatus').textContent = 'Generating key...';
}
async function connectGuest() {
    const raw = document.getElementById("guestAnswerBox").value.trim();
    const status = document.getElementById("connectStatus");
    if (!raw) { status.style.color="#ff3366"; status.textContent="⚠ Paste the guest key first"; return; }
    if (!peerConnection) { status.style.color="#ff3366"; status.textContent="⚠ Click Go Live first to create the connection"; return; }
    try {
        const d = JSON.parse(raw);
        await peerConnection.setRemoteDescription(d);
        status.style.color="#00ff88";
        status.textContent="✓ Guest connected!";
        setTimeout(() => { document.getElementById("passkeyPanel").style.display="none"; }, 2000);
    } catch(e) {
        status.style.color="#ff3366";
        status.textContent="⚠ Invalid key — make sure the guest copied the full key";
    }
}

// 4. CHAT SYSTEM
function toggleChat() {
    const isHidden = chatPanel.style.display === "none" || chatPanel.style.display === "";
    chatPanel.style.display = isHidden ? "flex" : "none";
    chatToggle.classList.remove("has-new");
}

function sendMsg() {
    const val = document.getElementById("msgIn").value;
    if(dataChannel) dataChannel.send(val);
    addChat("Studio: " + val);
    document.getElementById("msgIn").value = "";
}

function addChat(m) {
    const d = document.createElement("div");
    d.style.marginBottom = "10px";
    d.textContent = m;
    document.getElementById("chatMsgs").appendChild(d);
}

// 5. RECORDING — works on all browsers/devices
let recTimerInterval, recSeconds = 0;

function getSupportedMime() {
    const types = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
    ];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
}

async function toggleRec() {
    const btn = document.getElementById("recBtn");

    // STOP
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btn.classList.remove("rec-active");
        btn.textContent = "⏺ Record";
        clearInterval(recTimerInterval);
        showStatus("⏹ Stopped — preparing file...", "ok");
        return;
    }

    // START — make sure we have a stream
    if (!localStream) {
        showStatus("⚠ Camera not active yet", "error");
        return;
    }

    try {
        const mime = getSupportedMime();
        const options = mime ? { mimeType: mime } : {};
        mediaRecorder = new MediaRecorder(localStream, options);
        recordedChunks = [];

        mediaRecorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const ext  = mime.includes('mp4') ? 'mp4' : 'webm';
            const blob = new Blob(recordedChunks, { type: mime || 'video/webm' });
            const now  = new Date();
            const stamp = now.toISOString().slice(0,16).replace('T','_').replace(/:/g,'-');
            const filename = `CoachL_Session_${stamp}.${ext}`;

            // Auto download
            const url = URL.createObjectURL(blob);
            const a   = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 30000);

            showStatus(`✓ Saved as ${filename} — check your Downloads`, "ok");
            btn.textContent = "⏺ Record";
        };

        mediaRecorder.start(1000); // collect data every second
        btn.classList.add("rec-active");
        btn.textContent = "⏹ Stop Rec";

        // Timer
        recSeconds = 0;
        recTimerInterval = setInterval(() => {
            recSeconds++;
            const m = String(Math.floor(recSeconds/60)).padStart(2,'0');
            const s = String(recSeconds % 60).padStart(2,'0');
            btn.textContent = `⏹ ${m}:${s}`;
        }, 1000);

        showStatus("⏺ Recording started", "ok");

    } catch(err) {
        showStatus("⚠ Recording failed: " + err.message, "error");
        console.error("Recording error:", err);
    }
}

// COPY PASSKEY
function copyKey() {
    const val = document.getElementById("signalBox").value;
    if (!val) { alert("No key yet — click Go Live first"); return; }
    navigator.clipboard.writeText(val).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.textContent = "✓ Copied!";
        btn.style.background = "rgba(0,255,136,0.35)";
        setTimeout(() => { btn.textContent = "📋 Copy"; btn.style.background = "rgba(0,255,136,0.15)"; }, 2000);
    }).catch(() => {
        // Fallback for older browsers
        document.getElementById("signalBox").select();
        document.execCommand("copy");
        document.getElementById("copyBtn").textContent = "✓ Copied!";
    });
}

// TOGGLE PASSKEY PANEL
function togglePasskeyPanel() {
    const panel = document.getElementById("passkeyPanel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
}


    // EXIT STUDIO
    function exitStudio() {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        window.location.href = "index.html";
    }

    // ── JSONBIN KEY SHARING ──────────────────────────────────────────
    // Free public bin — host/guest posts key here, podcasts fetches it
    // Sign up free at jsonbin.io, create a bin, paste the ID below
    const JSONBIN_BIN_ID  = "69a1f6a143b1c97be9a47683"; // ← paste your bin ID
    const JSONBIN_API_KEY = "$2a$10$rrbUaGuzPLEAqxVhsaxdYuSIEP8b0SIn89iWfCA6VkQvXlhPNA.vG"; // ← paste your API key

    async function shareKeyOnline() {
        const key = document.getElementById("signalBox").value;
        if (!key) { showStatus("⚠ Generate a key first — click Go Live", "error"); return; }
        if (JSONBIN_BIN_ID === "69a1f6a143b1c97be9a47683") {
            // Fallback: copy to clipboard + show instructions
            navigator.clipboard.writeText(key).catch(()=>{});
            showStatus("✓ Key copied — send to viewer via WhatsApp", "ok");
            return;
        }
        try {
            showStatus("Sharing key online...", "ok");
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": JSONBIN_API_KEY
                },
                body: JSON.stringify({ role: "guest", key: key, ts: Date.now() })
            });
            if (res.ok) {
                showStatus("✓ Key shared — viewer can fetch it now", "ok");
            } else {
                showStatus("⚠ Share failed — copy key manually", "error");
            }
        } catch(e) {
            showStatus("⚠ No connection — copy key manually", "error");
        }
    }
    
</script>
<button id="exitBtn" onclick="exitStudio()">✕ Exit Studio</button>
</body>
</html>
