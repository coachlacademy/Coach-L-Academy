<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach L Academy | Live & Archives</title>
    <style>
        :root {
            --primary-blue: #00d2ff;
            --accent-green: #39ff14;
            --live-red: #ff4b2b;
            --bg-dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(to right, rgba(0,0,0,0.85) 30%, rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1590602847861-f357a9332bbc?q=80&w=2000');
            background-size: cover; background-position: center; z-index: -2; 
        }
        .large-bg-text {
            position: fixed; top: 30%; left: 5%; font-size: clamp(5rem, 18vw, 15rem);
            font-weight: 900; color: rgba(255, 255, 255, 0.04); z-index: -1;
            text-transform: uppercase; pointer-events: none; letter-spacing: -5px;
        }

        .pulse-dot {
            height: 10px; width: 10px; background-color: var(--live-red);
            border-radius: 50%; display: inline-block; margin-right: 8px;
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 75, 43, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); }
        }

        nav {
            position: fixed; top: 0; width: 100%; padding: 25px 50px;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        .logo { font-size: 24px; font-weight: 800; text-transform: uppercase; }
        .logo span { color: var(--primary-blue); }

        .hero { height: 80vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; position: relative; z-index: 10; }
        .hero h1 { font-size: clamp(4rem, 12vw, 8rem); font-weight: 900; line-height: 1; text-transform: uppercase; }
        .hero h2 { font-size: 24px; color: var(--primary-blue); margin-bottom: 30px; font-weight: 300; }
        
        .btn-action {
            background-color: var(--accent-green); color: #000; padding: 18px 40px;
            border-radius: 4px; font-weight: 900; border: none; cursor: pointer; 
            transition: all 0.4s ease; text-transform: uppercase;
        }
        .btn-action.is-playing { background-color: var(--live-red); color: #fff; box-shadow: 0 0 20px rgba(255, 75, 43, 0.4); }

        .main-container { padding: 0 5% 100px; position: relative; z-index: 20; }
        .row-title { font-size: 24px; margin: 60px 0 25px; border-left: 4px solid var(--primary-blue); padding-left: 15px; font-weight: 700; }

        .podcast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        .podcast-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px); border-radius: 12px; overflow: hidden;
            transition: 0.4s; position: relative;
        }
        .podcast-card:hover { transform: translateY(-5px); border-color: var(--primary-blue); }

        .thumb { width: 100%; height: 180px; position: relative; background: #111; overflow: hidden; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .card-tag { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.7); padding: 4px 10px; font-size: 11px; border-radius: 3px; font-weight: 700; }
        .card-info { padding: 20px; }
        .card-info h4 { margin-bottom: 8px; font-size: 18px; display: flex; align-items: center; }
        .card-info p { font-size: 13px; color: #aaa; margin-bottom: 15px; line-height: 1.4; }
        .price-tag { font-size: 14px; color: var(--primary-blue); font-weight: 800; text-transform: uppercase; display: block; cursor: pointer; }

        .jitsi-overlay {
            position: absolute; top: 12px; right: 12px; z-index: 100;
            display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
        }
        .ctrl-btn {
            background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 7px 14px; border-radius: 4px; font-size: 10px;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .ctrl-btn.stop { background: var(--live-red); border: none; }

        .archive-viewport { width: 100%; overflow: hidden; padding: 20px 0; }
        .archive-track { display: flex; gap: 25px; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .archive-track .podcast-card { flex: 0 0 280px; }
    </style>
</head>
<body>

<audio id="radioPlayer" preload="none">
    <source src="https://coach-l-radio.duckdns.org/listen/coach-l-radio/radio.mp3" type="audio/mpeg">
</audio>

<script>
const player = document.getElementById('radioPlayer');
const playBtn = document.getElementById('playToggle');
player.volume = 0.65;

playBtn.onclick = () => {
    if (player.paused) {
        player.play().catch(err => console.log("Autoplay blocked:", err));
        playBtn.classList.add('is-playing');
        playBtn.innerText = "Stop Listening";
    } else {
        player.pause();
        player.currentTime = 0;
        playBtn.classList.remove('is-playing');
        playBtn.innerText = "Start Listening";
    }
};

function launchStream(type) {
    const container = document.getElementById(`container-${type}`);
    const poster = document.getElementById(`minPoster-${type}`);
    const frame = document.getElementById(`iframe-${type}`);
    
    let url = "";
    if (type === 'jitsi') {
        url = "https://meet.jit.si/CoachLGuestRoom#config.prejoinPageEnabled=false&config.startWithAudioMuted=true&config.startWithVideoMuted=true";
    } else if (type === 'youtube') {
        url = "https://www.youtube.com/embed/lqWVi6zHtRQ?autoplay=1&mute=1";
    } else if (type === 'facebook') {
        url = "https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/facebook/videos/10153231379946729/&show_text=0&autoplay=1";
    }

    frame.src = url;
    poster.style.display = 'none';
    container.style.display = 'block';
    
    if (!player.paused) playBtn.click();
}

function stopStream(type) {
    const container = document.getElementById(`container-${type}`);
    const poster = document.getElementById(`minPoster-${type}`);
    const frame = document.getElementById(`iframe-${type}`);
    frame.src = "";
    container.style.display = 'none';
    poster.style.display = 'block';
    if(document.fullscreenElement) document.exitFullscreen();
}

const track = document.getElementById('archiveTrack');
let index = 0;
const slide = () => {
    index = (index + 1) % track.children.length;
    track.style.transform = `translateX(-${index * 305}px)`;
};
setInterval(slide, 3000);
</script>

</body>
</html>
