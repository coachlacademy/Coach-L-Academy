<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coach L Radio – Live Podcast</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://meet.jit.si/external_api.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%;
  font-family: "Segoe UI", sans-serif;
  background: #0b0b0b;
  color: #fff;
  scroll-behavior: smooth;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
}

/* ===== SECTION SNAP ===== */
.section {
  height: 100vh;
  width: 100%;
  scroll-snap-align: start;
  position: relative;
}

/* ===== HERO ===== */
.hero {
  background: url("les.jpg") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Overlay */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

/* Hero Content */
.hero-content {
  position: relative;
  text-align: center;
  z-index: 2;
}

.hero h1 {
  font-size: 2.8rem;
  color: white;
}
.hero h1 span {
  color: red;
}

#instructions {
  margin-top: 15px;
  font-size: 1.1rem;
  color: #ddd;
}

#liveBadge {
  display: none;
  margin-top: 15px;
  padding: 8px 16px;
  background: red;
  color: white;
  border-radius: 20px;
  font-weight: bold;
}

#countdown {
  margin-top: 20px;
  font-size: 1.2rem;
  color: #ff4444;
}

/* ===== JITSI SECTION ===== */
#jitsi-section {
  width: 100%;
  height: 100%;
  border-radius: 0;
  overflow: hidden;
  display: none;
}

/* ===== PODCAST SECTIONS ===== */
.podcast-section {
  padding: 20px 8%;
  background: #0b0b0b;
  overflow-y: auto;
}

.podcast-section h2 {
  color: red;
  margin-bottom: 20px;
}

.podcast-section iframe {
  width: 100%;
  height: 500px;
  border-radius: 12px;
  border: none;
  background: #111;
  margin-bottom: 30px;
}

/* ===== MODAL ===== */
.modal {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.9);
  z-index: 50;
  overflow-y:auto;
  padding: 50px 10%;
  box-sizing: border-box;
}

.modal-content {
  max-width: 900px;
  margin: auto;
}

.modal-close {
  position: absolute;
  top:20px;
  right:30px;
  font-size: 2rem;
  color: #ff3333;
  cursor:pointer;
}

button.view-archive {
  margin-top: 25px;
  padding: 12px 30px;
  font-size: 1rem;
  border:none;
  border-radius:20px;
  background:#ff3333;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HERO SECTION -->
<section class="section hero">
  <div class="hero-content">
    <h1>Coach L <span>Live Podcast</span></h1>
    <div id="instructions">
      Please wait for the host to go live.<br>
      When prompted, click <strong>“Join in browser”</strong>.
    </div>
    <div id="liveBadge">🔴 LIVE NOW</div>
    <div id="countdown"></div>
    <button class="view-archive" onclick="openModal()">View Podcast Archive</button>
  </div>
</section>

<!-- JITSI SECTION -->
<section class="section" id="jitsi-section"></section>

<!-- PODCAST ARCHIVE SECTION -->
<section class="section podcast-section">
  <h2>🎧 Audio Podcast Archive</h2>
  <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/embed/podcasts"></iframe>

  <h2>📺 Video Podcast Playlist</h2>
  <iframe 
    src="https://www.youtube.com/embed?listType=playlist&list=UUaiYEOdH76vck0iwC4vt1IQ&autoplay=1&mute=1"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
</section>

<!-- MODAL FOR PODCAST ARCHIVE -->
<div id="podcastModal" class="modal">
  <span class="modal-close" onclick="closeModal()">×</span>
  <div class="modal-content">
    <h2>🎧 Audio Podcast Archive</h2>
    <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/embed/podcasts"></iframe>

    <h2>📺 Video Podcast Playlist</h2>
    <iframe 
      src="https://www.youtube.com/embed?listType=playlist&list=UUaiYEOdH76vck0iwC4vt1IQ&autoplay=1&mute=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>
</div>

<script>
/* ===== CONFIG ===== */
const ROOM_NAME = "CoachLGuestRoom";
const nextShow = new Date("2026-02-01T19:00:00");

/* ===== COUNTDOWN ===== */
const countdownEl = document.getElementById("countdown");
function updateCountdown() {
  const now = new Date();
  const diff = nextShow - now;
  if (diff <= 0) {
    countdownEl.style.display = "none";
    return;
  }
  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff/(1000*60*60)) % 24);
  const m = Math.floor((diff/(1000*60)) % 60);
  countdownEl.innerHTML = `Next live podcast in <strong>${d}d ${h}h ${m}m</strong>`;
}
setInterval(updateCountdown, 60000);
updateCountdown();

/* ===== JITSI VIEWER ===== */
let api = null;
function startJitsi() {
  if (api) return;
  const container = document.getElementById("jitsi-section");
  container.style.display = "block";
  document.getElementById("instructions").style.display = "none";
  document.getElementById("liveBadge").style.display = "inline-block";
  countdownEl.style.display = "none";

  api = new JitsiMeetExternalAPI("meet.jit.si", {
    roomName: ROOM_NAME,
    parentNode: container,
    width: "100%",
    height: "100%",
    configOverwrite: {
      startWithAudioMuted: true,
      startWithVideoMuted: true,
      prejoinPageEnabled: true,
      disableDeepLinking: true
    },
    interfaceConfigOverwrite: {
      TOOLBAR_BUTTONS: ["chat","tileview"]
    }
  });

  api.addEventListener("readyToClose", resetJitsi);
  api.addEventListener("videoConferenceLeft", resetJitsi);
}

function resetJitsi() {
  if (api) {
    api.dispose();
    api = null;
  }
  document.getElementById("jitsi-section").style.display = "none";
  document.getElementById("instructions").style.display = "block";
  document.getElementById("liveBadge").style.display = "none";
  updateCountdown();
}

/* ===== MODAL FUNCTIONS ===== */
function openModal() { document.getElementById("podcastModal").style.display = "block"; }
function closeModal() { document.getElementById("podcastModal").style.display = "none"; }

/* ===== AUTO START JITSI VIEWER ===== */
startJitsi();
</script>

</body>
</html>
