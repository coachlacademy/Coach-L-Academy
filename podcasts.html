<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coach L Radio – Live Podcast</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://meet.jit.si/external_api.js"></script>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #0b0b0b;
  color: #fff;
}

/* ===== HERO ===== */
.hero {
  position: relative;
  height: 70vh;
  background: url("les.jpg") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

.hero-content {
  position: relative;
  text-align: center;
  z-index: 2;
}

.hero h1 {
  font-size: 2.8rem;
  color: white;
}

.hero h1 span {
  color: red;
}

#instructions {
  margin-top: 15px;
  font-size: 1.1rem;
  color: #ddd;
}

#liveBadge {
  display: none;
  margin-top: 15px;
  padding: 8px 16px;
  background: red;
  color: white;
  border-radius: 20px;
  font-weight: bold;
}

#countdown {
  margin-top: 20px;
  font-size: 1.2rem;
  color: #ff4444;
}

/* JITSI */
#jitsi-container {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 360px;
  height: 240px;
  border-radius: 12px;
  overflow: hidden;
  display: none;
  z-index: 5;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

/* ===== SECTIONS ===== */
.section {
  padding: 60px 8%;
}

.section h2 {
  margin-bottom: 20px;
  color: red;
}

iframe {
  width: 100%;
  border: none;
  border-radius: 16px;
  background: #111;
}

/* ===== MODAL OVERLAY ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  width: 90%;
  max-width: 1000px;
  height: 80vh;
  background: #111;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 0 40px rgba(255,0,0,0.25);
  position: relative;
}

.modal h3 {
  color: red;
  margin-bottom: 15px;
}

.close-modal {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 1.8rem;
  cursor: pointer;
  color: #fff;
}

.open-modal-btn {
  display: inline-block;
  margin-bottom: 20px;
  padding: 12px 22px;
  background: red;
  color: white;
  border-radius: 30px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Coach L <span>Live Podcast</span></h1>

    <div id="instructions">
      Please wait for the host to go live.<br>
      When prompted, click <strong>“Join in browser”</strong>.
    </div>

    <div id="liveBadge">🔴 LIVE NOW</div>
    <div id="countdown"></div>
  </div>

  <div id="jitsi-container"></div>
</section>

<!-- PODCASTS -->
<section class="section">
  <h2>🎧 Podcast Episodes</h2>

  <!-- OPEN MODAL BUTTON -->
  <div class="open-modal-btn" onclick="openModal()">
    Open Podcast Archive
  </div>

  <!-- EXISTING IFRAME (LEFT AS-IS) -->
  <iframe
    src="https://coach-l-radio.duckdns.org/public/coach-l-radio/embed/podcasts"
    height="600"
    loading="lazy">
  </iframe>
</section>

<!-- YOUTUBE -->
<section class="section">
  <h2>📺 Video Podcasts</h2>
  <iframe
    src="https://www.youtube.com/embed?listType=playlist&list=YOUR_PLAYLIST_ID"
    height="450"
    allowfullscreen>
  </iframe>
</section>

<!-- ===== MODAL ===== -->
<div class="modal" id="podcastModal">
  <div class="modal-content">
    <div class="close-modal" onclick="closeModal()">✕</div>
    <h3>🎙️ Audio Podcast Archive</h3>

    <!-- You will populate this later -->
    <iframe
      src="https://coach-l-radio.duckdns.org/public/coach-l-radio/embed/podcasts"
      style="height: calc(100% - 60px);">
    </iframe>
  </div>
</div>

<script>
/* ===== MODAL CONTROL ===== */
function openModal() {
  document.getElementById("podcastModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("podcastModal").style.display = "none";
}

/* ===== CONFIG ===== */
const ROOM_NAME = "CoachLGeluestRoom";
const nextShow = new Date("2026-02-01T19:00:00");

const countdownEl = document.getElementById("countdown");

function updateCountdown() {
  const diff = nextShow - new Date();
  if (diff <= 0) return;

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff / 3600000) % 24);
  const m = Math.floor((diff / 60000) % 60);

  countdownEl.innerHTML =
    `Next live podcast in <strong>${d}d ${h}h ${m}m</strong>`;
}

setInterval(updateCountdown, 60000);
updateCountdown();
</script>

</body>
</html>
