<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach L Academy | Live & Archives</title>
    <style>
        :root {
            --primary-blue: #00d2ff;
            --accent-green: #39ff14;
            --live-red: #ff4b2b;
            --bg-dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
        }

        /* FIXED BACKGROUND */
        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(to right, rgba(0,0,0,0.85) 30%, rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1590602847861-f357a9332bbc?q=80&w=2000');
            background-size: cover; background-position: center; z-index: -2; 
        }
        .large-bg-text {
            position: fixed; top: 30%; left: 5%; font-size: clamp(5rem, 18vw, 15rem);
            font-weight: 900; color: rgba(255, 255, 255, 0.04); z-index: -1;
            text-transform: uppercase; pointer-events: none; letter-spacing: -5px;
        }

        /* NAV */
        nav {
            position: fixed; top: 0; width: 100%; padding: 25px 50px;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        .logo { font-size: 24px; font-weight: 800; text-transform: uppercase; }
        .logo span { color: var(--primary-blue); }

        /* HERO */
        .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; position: relative; z-index: 10; }
        .hero h1 { font-size: clamp(4rem, 12vw, 8rem); font-weight: 900; line-height: 1; text-transform: uppercase; }
        .hero h2 { font-size: 24px; color: var(--primary-blue); margin-bottom: 30px; font-weight: 300; }
        
        .btn-action {
            background-color: var(--accent-green); color: #000; padding: 18px 40px;
            border-radius: 4px; font-weight: 900; border: none; cursor: pointer; 
            transition: all 0.4s ease; text-transform: uppercase; font-size: 16px;
        }
        .btn-action.is-playing { background-color: var(--live-red); color: #fff; box-shadow: 0 0 20px rgba(255, 75, 43, 0.4); }

        /* CONTENT */
        .main-container { padding: 0 5% 100px; position: relative; z-index: 20; }
        .row-title { font-size: 24px; margin: 60px 0 25px; border-left: 4px solid var(--primary-blue); padding-left: 15px; font-weight: 700; }

        .podcast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        .podcast-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px); border-radius: 12px; overflow: hidden;
            transition: 0.4s; position: relative;
        }

        /* LIVE VIEWER STAGE */
        #viewerStage { display:grid; grid-template-columns:1fr; background:#000; min-height:420px; position:relative; border-radius: 12px 12px 0 0; }
        .video-slot { position:relative; min-height:420px; display:flex; align-items:center; justify-content:center; background:#050505; }
        .video-slot video { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
        
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
    </style>
</head>
<body>
<div class="fixed-bg"></div>
<div class="large-bg-text">Podcasts</div>

<nav>
    <div class="logo">Coach L <span>Academy</span></div>
    <button class="btn-action" style="padding:10px 20px; font-size: 12px;">Sign In</button>
</nav>

<audio id="radioPlayer" preload="none">
    <source src="https://coach-l-radio.duckdns.org/listen/coach-l-radio/radio.mp3" type="audio/mpeg">
</audio>

<div class="hero">
    <h1>LIVE STUDIO</h1>
    <h2>Broadcasts & Community Chat</h2>
    <button id="playToggle" class="btn-action">Start Radio</button>
</div>

<div class="main-container">
    <h3 class="row-title">Live Session</h3>
    <div class="podcast-card" style="grid-column: 1/-1;">
        
        <div id="viewerStage">
            <div class="video-slot" id="hostSlot">
                <div style="position:absolute;top:12px;left:12px;background:rgba(255,75,43,0.9);padding:5px 12px;border-radius:4px;font-size:11px;font-weight:900;z-index:10;">LIVE HOST</div>
                <div id="hostPlaceholder" style="color:#222; text-align:center;">
                    <div style="font-size:50px;">🎙️</div>
                    <p>Host is offline</p>
                </div>
                <video id="hostVideo" autoplay playsinline style="display:none;"></video>
            </div>

            <div class="video-slot" id="guestSlot" style="display:none; border-left: 1px solid #222;">
                <div style="position:absolute;top:12px;left:12px;background:rgba(168,85,247,0.9);padding:5px 12px;border-radius:4px;font-size:11px;font-weight:900;z-index:10;">LIVE GUEST</div>
                <div id="guestPlaceholder" style="color:#222; text-align:center;">
                    <div style="font-size:50px;">🎤</div>
                    <p>Guest is offline</p>
                </div>
                <video id="guestVideo" autoplay playsinline style="display:none;"></video>
            </div>
        </div>

        <div style="padding:20px; background: #111; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <button onclick="watchLive('host')" id="hostWatchBtn" style="width:100%; padding:15px; background: #ff4b2b; color:#fff; border:none; border-radius:8px; font-weight:900; cursor:pointer; text-transform:uppercase;">Watch Host</button>
                <p id="hostStatus" style="font-size:11px; text-align:center; margin-top:8px; color:#666;">Not Connected</p>
            </div>
            <div>
                <button onclick="watchLive('guest')" id="guestWatchBtn" style="width:100%; padding:15px; background: #a855f7; color:#fff; border:none; border-radius:8px; font-weight:900; cursor:pointer; text-transform:uppercase;">Watch Guest</button>
                <p id="guestStatus" style="font-size:11px; text-align:center; margin-top:8px; color:#666;">Not Connected</p>
            </div>
        </div>

        <div style="background: #000; border-top: 1px solid #222;">
            <div id="liveChatMsgs" style="height:150px; overflow-y:auto; padding:15px; font-size:13px;">
                <div style="color:#444;">Welcome to the live chat. Connect to a stream to start...</div>
            </div>
            <div style="display:flex; padding:10px; gap:10px; background: #0a0a0a;">
                <input type="text" id="liveChatInput" placeholder="Type a message..." style="flex:1; background:#1a1a1a; border:1px solid #333; color:#fff; padding:10px; border-radius:5px; outline:none;">
                <button onclick="sendLiveChat()" style="background:var(--primary-blue); color:#000; border:none; padding:10px 20px; border-radius:5px; font-weight:900; cursor:pointer;">SEND</button>
            </div>
        </div>
    </div>
</div>

<script>
    const PEER_IDS = { host: 'coachl-host-live', guest: 'coachl-guest-live' };
    let viewerPeers = { host: null, guest: null };
    let chatConns = { host: null, guest: null };

    // Radio Logic
    const player = document.getElementById('radioPlayer');
    const playBtn = document.getElementById('playToggle');
    playBtn.onclick = () => {
        if (player.paused) { player.play(); playBtn.innerText = "Stop Radio"; playBtn.classList.add('is-playing'); }
        else { player.pause(); playBtn.innerText = "Start Radio"; playBtn.classList.remove('is-playing'); }
    };

    // CORE CONNECTION LOGIC
    function watchLive(role) {
        const btn = document.getElementById(role + 'WatchBtn');
        const status = document.getElementById(role + 'Status');
        
        // DISCONNECT IF ACTIVE
        if (viewerPeers[role]) {
            viewerPeers[role].destroy();
            viewerPeers[role] = null;
            chatConns[role] = null;
            resetUI(role);
            return;
        }

        btn.innerText = "Connecting...";
        
        // Generate a completely unique ID for every click to prevent collisions
        const myUniqueId = 'viewer-' + role + '-' + Math.floor(Math.random() * 999999);
        const vp = new Peer(myUniqueId, { host: '0.peerjs.com', port: 443, path: '/', secure: true });
        viewerPeers[role] = vp;

        vp.on('open', () => {
            console.log("Viewer Peer Open: " + myUniqueId);
            
            // 1. Start the Video Call
            const call = vp.call(PEER_IDS[role], null); // Request their stream
            
            if (!call) {
                status.innerText = "Broadcaster offline";
                status.style.color = "#ff4b2b";
                btn.innerText = "Watch " + role;
                return;
            }

            call.on('stream', stream => {
                const vid = document.getElementById(role + 'Video');
                const place = document.getElementById(role + 'Placeholder');
                vid.srcObject = stream;
                vid.style.display = "block";
                place.style.display = "none";
                btn.innerText = "Stop " + role;
                status.innerText = "CONNECTED";
                status.style.color = "#00ff88";
                
                if (role === 'guest') {
                    document.getElementById('guestSlot').style.display = "flex";
                    document.getElementById('viewerStage').style.gridTemplateColumns = "1fr 1fr";
                }
            });

            // 2. Start the Chat Connection
            const conn = vp.connect(PEER_IDS[role]);
            chatConns[role] = conn;

            conn.on('open', () => {
                addChat('System', 'Connected to ' + role + ' chat', '#00ff88');
            });

            conn.on('data', data => {
                addChat(role, data, role === 'host' ? '#ff4b2b' : '#a855f7');
            });
        });

        vp.on('error', err => {
            status.innerText = role + " is not live yet";
            status.style.color = "#ff4b2b";
            btn.innerText = "Watch " + role;
            console.error(err);
        });
    }

    function resetUI(role) {
        const vid = document.getElementById(role + 'Video');
        const place = document.getElementById(role + 'Placeholder');
        const btn = document.getElementById(role + 'WatchBtn');
        const status = document.getElementById(role + 'Status');
        
        vid.srcObject = null;
        vid.style.display = "none";
        place.style.display = "block";
        btn.innerText = "Watch " + role;
        status.innerText = "Disconnected";
        status.style.color = "#666";

        if (role === 'guest') {
            document.getElementById('guestSlot').style.display = "none";
            document.getElementById('viewerStage').style.gridTemplateColumns = "1fr";
        }
    }

    function sendLiveChat() {
        const input = document.getElementById('liveChatInput');
        const msg = input.value.trim();
        if (!msg) return;

        let sent = false;
        ['host', 'guest'].forEach(role => {
            if (chatConns[role] && chatConns[role].open) {
                chatConns[role].send(msg);
                sent = true;
            }
        });

        if (sent) {
            addChat('You', msg, '#00d2ff');
            input.value = '';
        } else {
            addChat('System', 'You must be connected to a live stream to chat', '#ff4b2b');
        }
    }

    function addChat(who, msg, color) {
        const area = document.getElementById('liveChatMsgs');
        if (area.innerHTML.includes('Welcome to the live chat')) area.innerHTML = '';
        const div = document.createElement('div');
        div.style.marginBottom = "8px";
        div.innerHTML = `<b style="color:${color}">${who}:</b> ${msg}`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }
</script>
</body>
</html>
