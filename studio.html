<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach L Radio – Host Studio</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height:100%;
  font-family:'Segoe UI', sans-serif;
  background:#000;
  color:#fff;
  scroll-behavior:smooth;
}

/* PASSWORD LOCK */
#lockScreen {
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top, #222, #000);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.lock-box {
  background:#111;
  padding:30px;
  border-radius:14px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,0,0,0.3);
}

.lock-box input {
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:16px;
  margin-top:10px;
  text-align:center;
}

.lock-box button {
  margin-top:15px;
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  background:#e53935;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.lock-error {
  margin-top:10px;
  font-size:0.85rem;
  color:#ff6666;
  display:none;
}

/* SCROLL SNAP */
body { overflow-y:auto; scroll-snap-type:y mandatory; }

.top-ui {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:20;
  background:rgba(0,0,0,0.7);
  transition:all 0.6s ease;
}
.top-ui.hidden {
  opacity:0;
  transform:translateY(-100%);
  pointer-events:none;
  display:none;
}

header {
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge {
  background:#e53935;
  padding:6px 12px;
  border-radius:20px;
  font-size:0.7rem;
  font-weight:bold;
}

.notice {
  padding:10px;
  text-align:center;
  font-size:0.8rem;
  color:#ccc;
  border-top:1px solid rgba(255,255,255,0.1);
}

.section {
  height:100vh;
  width:100%;
  scroll-snap-align:start;
  position:relative;
}

iframe {
  width:100%;
  height:100%;
  border:none;
}

.scroll-indicator {
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  font-size:2rem;
  color:#ff3333;
  animation:bounce 1.5s infinite;
  z-index:10;
}

@keyframes bounce {
  0%,100% { transform:translate(-50%,0); }
  50% { transform:translate(-50%,10px); }
}

#exitBtn {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff3366;
  color:#fff;
  padding:10px 18px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  z-index:30;
}

footer {
  padding:20px;
  text-align:center;
  font-size:0.75rem;
  color:#777;
}
</style>
</head>

<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>🎙 Coach L Radio Studio</h2>
    <p>Enter access password</p>
    <input type="password" id="pwInput"
      onkeydown="if(event.key==='Enter') unlockStudio()">
    <button onclick="unlockStudio()">Enter Studio</button>
    <div class="lock-error" id="pwError">Incorrect password</div>
  </div>
</div>

<div class="top-ui" id="topUI">
  <header>
    <h1>🎙 Coach L Radio – Host Studio</h1>
    <div class="badge">HOST ONLY</div>
  </header>
  <div class="notice">
    When WebDJ connects, AutoDJ pauses and your microphone goes live.
  </div>
</div>

<!-- SECTION 1 -->
<section class="section">
  <iframe
    src="https://coach-l-radio.duckdns.org/public/coach-l-radio/dj"
    allow="microphone; autoplay; fullscreen">
  </iframe>
</section>

<!-- SECTION 2: NATIVE RECORDER -->
<section class="section">
  <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000;">

    <video id="studioPreview"
      autoplay
      playsinline
      muted
      style="width:90%; max-width:900px; border-radius:12px; box-shadow:0 0 20px rgba(255,0,0,0.4);">
    </video>

    <div style="margin-top:20px;">
      <button onclick="startCamera()">Camera</button>
      <button onclick="shareScreen()">Screen</button>
      <button onclick="startRecording()">Record</button>
      <button onclick="stopRecording()">Stop</button>
    </div>

  </div>
</section>

<!-- SECTION 3 -->
<section class="section">
  <iframe
    src="https://coach-l-radio.duckdns.org/public/coach-l-radio/schedule">
  </iframe>
</section>

<button id="exitBtn" onclick="exitStudio()">Exit Studio</button>

<footer>
  © 2025 Coach L Radio · Inspire • Teach • Heal
</footer>

<script>
const allowedPasswords = ["CoachL2025!","SadeeB","AlexisLove","Mutodi"];

function unlockStudio() {
  const val = document.getElementById("pwInput").value;
  if (allowedPasswords.includes(val)) {
    document.getElementById("lockScreen").style.display = "none";
  } else {
    document.getElementById("pwError").style.display = "block";
  }
}

function exitStudio() {
  window.location.href = "index.html";
}

/* ===== MEDIA ENGINE ===== */

let activeStream;
let mediaRecorder;
let recordedChunks = [];
let fileHandle;
const videoElement = document.getElementById("studioPreview");

async function startCamera() {
  activeStream = await navigator.mediaDevices.getUserMedia({
    video: {
      width: { ideal: 3840 },
      height: { ideal: 2160 },
      aspectRatio: 16/9,
      frameRate: { ideal: 60 }
    },
    audio: {
      echoCancellation: true,
      noiseSuppression: true
    }
  });
  videoElement.srcObject = activeStream;
}

async function shareScreen() {
  const screenStream = await navigator.mediaDevices.getDisplayMedia({
    video: {
      width: { ideal: 3840 },
      height: { ideal: 2160 },
      frameRate: 60
    },
    audio: true
  });

  const micStream = await navigator.mediaDevices.getUserMedia({
    audio: true
  });

  activeStream = new MediaStream([
    ...screenStream.getVideoTracks(),
    ...micStream.getAudioTracks()
  ]);

  videoElement.srcObject = activeStream;
}

async function startRecording() {
  if (!activeStream) {
    alert("Start Camera or Screen first.");
    return;
  }

  fileHandle = await window.showSaveFilePicker({
    suggestedName: "CoachLRecording.webm",
    types: [{
      description: "High Quality Video",
      accept: { "video/webm": [".webm"] }
    }]
  });

  mediaRecorder = new MediaRecorder(activeStream, {
    mimeType: "video/webm; codecs=vp9",
    videoBitsPerSecond: 25000000
  });

  recordedChunks = [];

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    alert("Recording saved in high quality.");
  };

  mediaRecorder.start();
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }
}
</script>

</body>
</html>
