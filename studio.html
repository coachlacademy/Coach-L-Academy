<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach L Radio – Host Studio</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:'Segoe UI',system-ui,sans-serif; overflow-y:auto; scroll-snap-type:y mandatory; }

#lockScreen { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:9999; }
.lock-box { background:#111; padding:40px; border-radius:24px; text-align:center; border:1px solid #333; box-shadow:0 20px 50px rgba(0,0,0,0.5); max-width:340px; width:90%; }
.lock-box h2 { margin-bottom:20px; font-size:20px; }
.lock-box input { display:block; width:100%; padding:15px; margin:10px 0; background:#222; border:none; color:#fff; border-radius:12px; text-align:center; font-size:16px; }
.lock-box button { width:100%; padding:15px; border-radius:12px; border:none; background:#e53935; color:#fff; font-weight:bold; cursor:pointer; font-size:16px; margin-top:8px; }
#unlockErr { color:#ff6666; font-size:12px; margin-top:8px; display:none; }

.section { height:100vh; width:100%; scroll-snap-align:start; position:relative; overflow:hidden; background:#000; }
.section iframe { width:100%; height:100%; border:none; }

.broadcast-container { position:relative; width:100%; height:100%; background:#050505; display:flex; align-items:center; justify-content:center; }
#mainDisplay { width:100%; height:100%; object-fit:cover; background:#000; display:none; }

#statusBar { display:none; position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,255,136,0.15); border:1px solid rgba(0,255,136,0.3); color:#00ff88; padding:8px 20px; border-radius:30px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; z-index:30; white-space:nowrap; pointer-events:none; }

#liveIndicator { display:none; position:absolute; top:20px; left:20px; background:rgba(255,75,43,0.9); padding:6px 16px; border-radius:20px; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:1px; z-index:30; align-items:center; gap:6px; }
.live-dot { width:8px; height:8px; border-radius:50%; background:#fff; animation:blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

#viewerCount { display:none; position:absolute; top:20px; left:160px; background:rgba(0,0,0,0.75); border:1px solid rgba(255,255,255,0.2); padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700; z-index:30; }

#camMsg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:5; padding:20px; }
#camMsg .icon { font-size:60px; margin-bottom:16px; }
#camMsg h3 { font-size:18px; font-weight:700; margin-bottom:8px; }
#camMsg p { font-size:13px; color:#666; margin-bottom:20px; line-height:1.6; }
#camMsg button { background:#e53935; color:#fff; border:none; border-radius:10px; padding:14px 32px; font-size:15px; font-weight:900; text-transform:uppercase; cursor:pointer; }

.overlay-controls { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:10; background:rgba(0,0,0,0.7); padding:10px 18px; border-radius:50px; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); flex-wrap:wrap; justify-content:center; max-width:95vw; }
.overlay-controls button { background:none; border:none; color:#fff; cursor:pointer; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:1px; padding:10px 8px; transition:0.2s; white-space:nowrap; }
.overlay-controls button:hover { color:#ff3366; }
.rec-active { color:#ff3366 !important; animation:blink 1.5s infinite; }
#goLiveBtn { color:#00ff88 !important; font-weight:900 !important; }
#goLiveBtn.live { color:#ff3366 !important; }

#chatToggle { position:absolute; top:20px; right:20px; font-size:22px; cursor:pointer; z-index:15; background:rgba(229,57,53,0.2); width:46px; height:46px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
#chatToggle.has-new { background:rgba(0,255,136,0.2); }
#chatPanel { position:absolute; top:76px; right:20px; width:300px; height:420px; background:rgba(10,10,10,0.97); border:1px solid #333; border-radius:16px; display:none; flex-direction:column; z-index:14; overflow:hidden; }
#chatMsgs { flex:1; overflow-y:auto; padding:12px; font-size:13px; line-height:1.6; }
.chat-msg { margin-bottom:8px; padding:6px 10px; border-radius:8px; background:rgba(255,255,255,0.05); }
.chat-msg .who { font-weight:700; font-size:11px; margin-bottom:2px; }
.chat-input-row { display:flex; padding:8px; background:#1a1a1a; border-top:1px solid #333; }
.chat-input-row input { flex:1; background:none; border:none; color:#fff; padding:8px; outline:none; font-size:13px; }
.chat-input-row button { background:none; border:none; color:#e53935; font-weight:bold; cursor:pointer; padding:8px; }

#exitBtn { position:fixed; bottom:24px; right:24px; background:#ff3366; color:#fff; padding:12px 24px; border-radius:30px; font-weight:900; cursor:pointer; z-index:9998; border:none; font-size:14px; letter-spacing:1px; box-shadow:0 4px 20px rgba(255,51,102,0.4); }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>🎙️ COACH L STUDIO</h2>
    <input type="password" id="pw" placeholder="ACCESS CODE" onkeydown="if(event.key==='Enter') unlock()">
    <div id="unlockErr">Wrong password</div>
    <button onclick="unlock()">ENTER STUDIO</button>
  </div>
</div>

<section class="section">
  <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/dj" allow="microphone; autoplay"></iframe>
</section>

<section class="section">
  <div class="broadcast-container">
    <div id="liveIndicator"><div class="live-dot"></div>LIVE</div>
    <div id="viewerCount">👁 <span id="vcNum">0</span> watching</div>
    <div id="chatToggle" onclick="toggleChat()">🔔</div>
    <div id="statusBar"></div>

    <div id="chatPanel">
      <div id="chatMsgs"></div>
      <div class="chat-input-row">
        <input type="text" id="msgIn" placeholder="Message viewers..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">SEND</button>
      </div>
    </div>

    <div id="camMsg">
      <div class="icon">📷</div>
      <h3>Camera Not Active</h3>
      <p>Tap below to start your camera.<br>Allow access when your browser asks.</p>
      <button onclick="initMedia()">📷 Start Camera</button>
    </div>

    <video id="mainDisplay" autoplay playsinline muted></video>

    <div class="overlay-controls">
      <button onclick="toggleCam()">🔄 Switch Cam</button>
      <button id="goLiveBtn" onclick="toggleLive()">📡 Go Live</button>
      <button id="recBtn" onclick="toggleRec()">⏺ Record</button>
      <button onclick="shareScreen()">🖥 Share Screen</button>
    </div>
  </div>
</section>

<section class="section">
  <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/schedule"></iframe>
</section>

<button id="exitBtn" onclick="exitStudio()">✕ Exit Studio</button>

<script>
const HOST_PEER_ID = 'coachl-host-live';

let localStream, mediaRecorder, peer, isLive = false;
let recordedChunks = [], recTimerInterval, recSeconds = 0;
let currentFacingMode = 'user';
let viewerCalls = {}, viewerChats = {};

// ── UNLOCK ────────────────────────────────────────────────────────────
function unlock() {
  const p = document.getElementById('pw').value;
  if (['CoachL2025!','SadeeB','AlexisLove','Mutodi'].includes(p)) {
    document.getElementById('lockScreen').style.display = 'none';
    document.querySelectorAll('.section')[1].scrollIntoView({behavior:'smooth'});
    initMedia();
  } else {
    document.getElementById('unlockErr').style.display = 'block';
    document.getElementById('pw').value = '';
  }
}

// ── CAMERA ────────────────────────────────────────────────────────────
async function initMedia() {
  const tries = [
    {video:{facingMode:currentFacingMode,width:{ideal:1920},height:{ideal:1080}},audio:true},
    {video:{facingMode:currentFacingMode,width:{ideal:1280},height:{ideal:720}},audio:true},
    {video:{facingMode:currentFacingMode},audio:true},
    {video:true,audio:true}
  ];
  for (const c of tries) {
    try { localStream = await navigator.mediaDevices.getUserMedia(c); break; }
    catch(e) { continue; }
  }
  if (!localStream) { showStatus('⚠ Camera denied — check browser permissions','error'); return; }
  const vid = document.getElementById('mainDisplay');
  vid.srcObject = localStream; vid.style.display = 'block';
  document.getElementById('camMsg').style.display = 'none';
  showStatus('✓ Camera active','ok');
}

function toggleCam() {
  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
  if (localStream) localStream.getTracks().forEach(t=>t.stop());
  localStream = null; initMedia();
}

async function shareScreen() {
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    document.getElementById('mainDisplay').srcObject = s;
    s.getVideoTracks()[0].onended = () => {
      if (localStream) document.getElementById('mainDisplay').srcObject = localStream;
      showStatus('Screen share ended — camera restored','ok');
    };
    showStatus('✓ Sharing screen','ok');
  } catch(e) { showStatus('⚠ Screen share cancelled','error'); }
}

// ── PEERJS LIVE ───────────────────────────────────────────────────────
function toggleLive() { isLive ? stopLive() : startLive(); }

function startLive() {
  if (!localStream) { showStatus('⚠ Start camera first','error'); return; }
  showStatus('Going live...','ok');
  if (peer && !peer.destroyed) peer.destroy();

  peer = new Peer(HOST_PEER_ID, {
    host:'0.peerjs.com', port:443, path:'/', secure:true, debug:0
  });

  peer.on('open', () => {
    isLive = true;
    document.getElementById('goLiveBtn').textContent = '🔴 Stop Live';
    document.getElementById('goLiveBtn').classList.add('live');
    document.getElementById('liveIndicator').style.display = 'flex';
    showStatus('✓ LIVE — viewers can now watch automatically','ok');
  });

  // Viewer calls in — answer with our stream
  peer.on('call', call => {
    call.answer(localStream);
    viewerCalls[call.peer] = call;
    updateViewerCount();
    call.on('close', () => { delete viewerCalls[call.peer]; updateViewerCount(); });
    call.on('error', () => { delete viewerCalls[call.peer]; updateViewerCount(); });
  });

  // Viewer opens chat connection
  peer.on('connection', conn => {
    viewerChats[conn.peer] = conn;
    conn.on('data', msg => {
      addChat('Viewer', msg, '#00d2ff');
      if (document.getElementById('chatPanel').style.display !== 'flex')
        document.getElementById('chatToggle').classList.add('has-new');
    });
    conn.on('close', () => delete viewerChats[conn.peer]);
  });

  peer.on('error', err => {
    if (err.type === 'unavailable-id') {
      // Previous session still registered — retry with slight delay
      setTimeout(() => {
        if (peer && !peer.destroyed) peer.destroy();
        startLive();
      }, 2000);
      showStatus('⚠ Previous session active — retrying...','error');
    } else {
      showStatus('⚠ ' + err.type,'error');
    }
  });
}

function stopLive() {
  if (peer && !peer.destroyed) peer.destroy();
  peer = null; isLive = false; viewerCalls = {}; viewerChats = {};
  document.getElementById('goLiveBtn').textContent = '📡 Go Live';
  document.getElementById('goLiveBtn').classList.remove('live');
  document.getElementById('liveIndicator').style.display = 'none';
  document.getElementById('viewerCount').style.display = 'none';
  showStatus('⏹ Stream ended','ok');
}

function updateViewerCount() {
  const n = Object.keys(viewerCalls).length;
  const el = document.getElementById('viewerCount');
  el.style.display = n > 0 ? 'block' : 'none';
  document.getElementById('vcNum').textContent = n;
}

// ── CHAT ──────────────────────────────────────────────────────────────
function toggleChat() {
  const p = document.getElementById('chatPanel');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  if (p.style.display === 'flex') document.getElementById('chatToggle').classList.remove('has-new');
}

function sendMsg() {
  const input = document.getElementById('msgIn');
  const msg = input.value.trim(); if (!msg) return;
  Object.values(viewerChats).forEach(conn => { try{ conn.send('Host: '+msg); }catch(e){} });
  addChat('Host (You)', msg, '#ff4b2b');
  input.value = '';
}

function addChat(who, msg, color) {
  const d = document.createElement('div'); d.className = 'chat-msg';
  d.innerHTML = `<div class="who" style="color:${color}">${who}</div>${msg}`;
  const msgs = document.getElementById('chatMsgs');
  msgs.appendChild(d); msgs.scrollTop = 99999;
}

// ── RECORDING ─────────────────────────────────────────────────────────
function getSupportedMime() {
  return ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}

async function toggleRec() {
  const btn = document.getElementById('recBtn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop(); btn.classList.remove('rec-active');
    btn.textContent = '⏺ Record'; clearInterval(recTimerInterval);
    showStatus('⏹ Saving recording...','ok'); return;
  }
  if (!localStream) { showStatus('⚠ Camera not active','error'); return; }
  const mime = getSupportedMime();
  mediaRecorder = new MediaRecorder(localStream, mime ? {mimeType:mime} : {});
  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if(e.data?.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recordedChunks, {type:mime||'video/webm'});
    const stamp = new Date().toISOString().slice(0,16).replace('T','_').replace(/:/g,'-');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `CoachL_Session_${stamp}.${ext}`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showStatus('✓ Recording saved to Downloads','ok');
    btn.textContent = '⏺ Record';
  };
  mediaRecorder.start(1000); btn.classList.add('rec-active'); btn.textContent = '⏹ Stop Rec';
  recSeconds = 0;
  recTimerInterval = setInterval(() => {
    recSeconds++;
    btn.textContent = `⏹ ${String(Math.floor(recSeconds/60)).padStart(2,'0')}:${String(recSeconds%60).padStart(2,'0')}`;
  }, 1000);
  showStatus('⏺ Recording started','ok');
}

// ── HELPERS ───────────────────────────────────────────────────────────
function showStatus(msg, type) {
  const b = document.getElementById('statusBar');
  b.textContent = msg;
  b.style.background = type==='error' ? 'rgba(255,51,102,0.9)' : 'rgba(0,255,136,0.15)';
  b.style.borderColor = type==='error' ? 'rgba(255,51,102,0.5)' : 'rgba(0,255,136,0.3)';
  b.style.color = type==='error' ? '#fff' : '#00ff88';
  b.style.display = 'block';
  clearTimeout(b._t); b._t = setTimeout(() => b.style.display='none', 4000);
}

function exitStudio() {
  if (isLive) stopLive();
  if (localStream) localStream.getTracks().forEach(t=>t.stop());
  window.location.href = 'index.html';
}
</script>
</body>
</html>
