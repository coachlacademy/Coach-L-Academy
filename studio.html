<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach L Radio – Host Studio</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%;
  font-family:'Segoe UI', sans-serif;
  background:#000;
  color:#fff;
  scroll-behavior:smooth;
}

.section {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

video {
  width:90%;
  max-width:900px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(255,0,0,0.4);
}

.controls button {
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:6px;
  background:#e53935;
  color:#fff;
  cursor:pointer;
}

#chatPanel {
  position:fixed;
  right:0;
  top:0;
  width:300px;
  height:100%;
  background:#111;
  border-left:1px solid #333;
  display:flex;
  flex-direction:column;
}

#chatMessages {
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:0.85rem;
}

#chatInputArea {
  display:flex;
}

#chatInputArea input {
  flex:1;
  padding:8px;
  border:none;
}

#chatInputArea button {
  padding:8px;
  border:none;
  background:#e53935;
  color:#fff;
}

#timer {
  margin-top:10px;
  font-weight:bold;
  color:#00ff88;
}
</style>
</head>

<body>

<section class="section">

  <video id="localVideo" autoplay playsinline muted></video>

  <div class="controls">
    <button onclick="startCamera()">Camera</button>
    <button onclick="toggleCamera()">Switch Cam</button>
    <button onclick="shareScreen()">Screen</button>
    <button onclick="createOffer()">Go Live</button>
    <button onclick="startRecording()">Record</button>
    <button onclick="stopRecording()">Stop</button>
  </div>

  <div id="timer">00:00</div>

  <textarea id="signalBox" placeholder="Connection Code Here" style="width:80%;height:80px;margin-top:10px;"></textarea>
  <button onclick="setRemote()">Connect Guest</button>

</section>

<div id="chatPanel">
  <div id="chatMessages"></div>
  <div id="chatInputArea">
    <input type="text" id="chatInput" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let localStream;
let peerConnection;
let dataChannel;
let mediaRecorder;
let recordedChunks = [];
let timerInterval;
let seconds = 0;
let currentFacingMode = "user";

const localVideo = document.getElementById("localVideo");
const signalBox = document.getElementById("signalBox");
const chatMessages = document.getElementById("chatMessages");

const servers = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

async function startCamera() {
  if (localStream) stopTracks();
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacingMode, width:{ideal:1920}, height:{ideal:1080}},
    audio: true
  });
  localVideo.srcObject = localStream;
}

async function toggleCamera() {
  currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
  await startCamera();
}

async function shareScreen() {
  const screenStream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
  localStream = screenStream;
  localVideo.srcObject = localStream;
}

function createPeer() {
  peerConnection = new RTCPeerConnection(servers);

  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  dataChannel = peerConnection.createDataChannel("chat");

  dataChannel.onmessage = e => {
    addMessage("Guest: " + e.data);
  };

  peerConnection.onicecandidate = event => {
    if (event.candidate) return;
    signalBox.value = JSON.stringify(peerConnection.localDescription);
  };
}

async function createOffer() {
  createPeer();
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
}

async function setRemote() {
  const remoteDesc = JSON.parse(signalBox.value);
  await peerConnection.setRemoteDescription(remoteDesc);

  if (remoteDesc.type === "offer") {
    createPeer();
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    signalBox.value = JSON.stringify(peerConnection.localDescription);
  }
}

function sendMessage() {
  const input = document.getElementById("chatInput");
  dataChannel.send(input.value);
  addMessage("Studio: " + input.value);
  input.value="";
}

function addMessage(msg) {
  const div = document.createElement("div");
  div.textContent = msg;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function startRecording() {
  mediaRecorder = new MediaRecorder(localStream, {videoBitsPerSecond:15000000});
  recordedChunks=[];
  mediaRecorder.ondataavailable=e=>recordedChunks.push(e.data);
  mediaRecorder.onstop=saveRecording;
  mediaRecorder.start();
  startTimer();
}

function stopRecording() {
  mediaRecorder.stop();
  stopTimer();
}

function saveRecording() {
  const blob = new Blob(recordedChunks,{type:"video/webm"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download="CoachLRecording.webm";
  a.click();
}

function startTimer() {
  seconds=0;
  timerInterval=setInterval(()=>{
    seconds++;
    const mins = String(Math.floor(seconds/60)).padStart(2,'0');
    const secs = String(seconds%60).padStart(2,'0');
    document.getElementById("timer").textContent=`${mins}:${secs}`;
  },1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

function stopTracks() {
  localStream.getTracks().forEach(track=>track.stop());
}
</script>

</body>
</html>
