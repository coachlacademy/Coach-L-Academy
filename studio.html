<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach L Radio – Studio</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:'Segoe UI', system-ui, sans-serif; overflow-y:auto; scroll-snap-type:y mandatory; }

#lockScreen { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:9999; }
.lock-box { background:#111; padding:40px; border-radius:24px; text-align:center; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.lock-box input { display:block; width:100%; padding:15px; margin:20px 0; background:#222; border:none; color:#fff; border-radius:12px; text-align:center; }
.lock-box button { width:100%; padding:15px; border-radius:12px; border:none; background:#e53935; color:#fff; font-weight:bold; cursor:pointer; }

.section { height:100vh; width:100%; scroll-snap-align:start; position:relative; overflow:hidden; background:#000; display:flex; justify-content:center; align-items:center; }
iframe { width:100%; height:100%; border:none; }

.broadcast-container { position:relative; width:100%; height:100%; background:#050505; display:flex; align-items:center; justify-content:center; flex-direction:column; }
#mainDisplay { width:90%; max-width:900px; height:auto; background:#000; border-radius:12px; box-shadow:0 0 20px rgba(255,0,0,0.5); }
.portrait { object-fit:contain !important; transform:scale(0.9); }

.overlay-controls { display:flex; gap:10px; margin-top:15px; flex-wrap:wrap; justify-content:center; }
.overlay-controls button { padding:10px 15px; border:none; border-radius:6px; background:#e53935; color:#fff; cursor:pointer; font-weight:bold; }

#chatToggle { position:absolute; top:20px; right:20px; font-size:24px; cursor:pointer; z-index:15; background:rgba(229,57,53,0.2); width:50px; height:50px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
#chatToggle.has-new::after { content:''; position:absolute; top:12px; right:12px; width:10px; height:10px; background:#00ff88; border-radius:50%; }

#chatPanel { position:absolute; top:80px; right:20px; width:320px; height:450px; background:rgba(15,15,15,0.95); border:1px solid #333; border-radius:16px; display:none; flex-direction:column; z-index:14; overflow:hidden; }
#chatMsgs { flex:1; overflow-y:auto; padding:15px; font-size:14px; line-height:1.6; }
.chat-input { display:flex; padding:10px; background:#222; }
.chat-input input { flex:1; background:none; border:none; color:#fff; padding:10px; outline:none; }
.chat-input button { background:#e53935; border:none; padding:10px; color:#fff; border-radius:6px; margin-left:5px; cursor:pointer; }

#signalBox { width:80%; height:50px; margin-top:10px; background:rgba(0,0,0,0.7); color:#0f0; border-radius:8px; padding:10px; font-size:12px; }
#timer { margin-top:10px; color:#0f0; font-weight:bold; }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
    <div class="lock-box">
        <h2>🎙️ COACH L STUDIO</h2>
        <input type="password" id="pw" placeholder="ACCESS CODE">
        <button onclick="unlock()">ENTER</button>
    </div>
</div>

<!-- WEB DJ -->
<section class="section">
    <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/dj" allow="microphone; autoplay"></iframe>
</section>

<!-- STUDIO VIDEO / BROADCAST -->
<section class="section">
    <div class="broadcast-container">
        <div id="chatToggle" onclick="toggleChat()">💬</div>
        <div id="chatPanel">
            <div id="chatMsgs"></div>
            <div class="chat-input">
                <input type="text" id="msgIn" placeholder="Reply to Guest...">
                <button onclick="sendMsg()">SEND</button>
            </div>
        </div>

        <video id="mainDisplay" autoplay playsinline muted></video>
        <div id="timer">00:00</div>

        <textarea id="signalBox" placeholder="Connection Passkey..."></textarea>

        <div class="overlay-controls">
            <button onclick="toggleCam()">🔄 Switch Cam</button>
            <button onclick="shareScreen()">🖥 Share Screen</button>
            <button onclick="startBroadcast()">📡 Go Live</button>
            <button onclick="connectGuest()">🔗 Link Guest</button>
            <button id="recBtn" onclick="toggleRec()">⏺ Record</button>
            <button onclick="stopRec()">⏹ Stop</button>
        </div>
    </div>
</section>

<!-- SCHEDULE -->
<section class="section">
    <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/schedule"></iframe>
</section>

<script>
let localStream, guestStream, peerConnection, dataChannel, mediaRecorder, recordedChunks = [], timerInterval;
let currentFacingMode = "user";
const mainDisplay = document.getElementById("mainDisplay");
const chatPanel = document.getElementById("chatPanel");
const chatToggle = document.getElementById("chatToggle");
const timerEl = document.getElementById("timer");

// 1. LOCK SCREEN
function unlock() {
    const val = document.getElementById("pw").value;
    if(["CoachL2025!","SadeeB","AlexisLove","Mutodi"].includes(val)) {
        document.getElementById("lockScreen").style.display="none";
        initMedia();
    } else alert("Wrong Code!");
}

// 2. CAMERA INIT
async function initMedia() {
    if(localStream) localStream.getTracks().forEach(t=>t.stop());
    localStream = await navigator.mediaDevices.getUserMedia({ 
        video:{facingMode:currentFacingMode, width:{ideal:1920}, height:{ideal:1080}}, 
        audio:true 
    });
    mainDisplay.srcObject = localStream;
}

// SWITCH FRONT/BACK
function toggleCam() {
    currentFacingMode = currentFacingMode==="user"?"environment":"user";
    initMedia();
}

// SHARE SCREEN
async function shareScreen() {
    const screenStream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
    localStream.getTracks().forEach(t=>t.stop());
    localStream = screenStream;
    mainDisplay.srcObject = localStream;
}

// PEER CONNECTION
function createPeer() {
    peerConnection = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
    localStream.getTracks().forEach(track=>peerConnection.addTrack(track, localStream));

    dataChannel = peerConnection.createDataChannel("chat");
    dataChannel.onmessage = e => addChat("Guest: " + e.data);

    peerConnection.ontrack = e => {
        guestStream = e.streams[0];
        mainDisplay.srcObject = guestStream;
    };

    peerConnection.onicecandidate = e => {
        if(!e.candidate) document.getElementById("signalBox").value = JSON.stringify(peerConnection.localDescription);
    };
}

// BROADCAST
async function startBroadcast() {
    createPeer();
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
}

// CONNECT GUEST
async function connectGuest() {
    const remoteDesc = JSON.parse(document.getElementById("signalBox").value);
    await peerConnection.setRemoteDescription(remoteDesc);
    if(remoteDesc.type==="offer") {
        createPeer();
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        document.getElementById("signalBox").value = JSON.stringify(peerConnection.localDescription);
    }
}

// CHAT
function toggleChat() {
    const isHidden = chatPanel.style.display==="none"||chatPanel.style.display==="";
    chatPanel.style.display = isHidden?"flex":"none";
    chatToggle.classList.remove("has-new");
}
function sendMsg() {
    const val = document.getElementById("msgIn").value;
    if(dataChannel) dataChannel.send(val);
    addChat("Studio: " + val);
    document.getElementById("msgIn").value="";
}
function addChat(msg) {
    const div = document.createElement("div");
    div.textContent = msg;
    document.getElementById("chatMsgs").appendChild(div);
    chatPanel.scrollTop = chatPanel.scrollHeight;
}

// RECORDING
async function toggleRec() {
    if(mediaRecorder && mediaRecorder.state==="recording") return;
    mediaRecorder = new MediaRecorder(localStream, { mimeType:"video/webm;codecs=vp9", videoBitsPerSecond:25000000 });
    recordedChunks = [];
    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
    mediaRecorder.onstop = saveRec;
    mediaRecorder.start();
    startTimer();
    document.getElementById("recBtn").classList.add("rec-active");
}
function stopRec() {
    if(mediaRecorder && mediaRecorder.state==="recording") {
        mediaRecorder.stop();
        document.getElementById("recBtn").classList.remove("rec-active");
        stopTimer();
    }
}
async function saveRec() {
    const blob = new Blob(recordedChunks, {type:"video/webm"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download="CoachLRecording.webm";
    a.click();
}

// TIMER
let seconds=0;
function startTimer() {
    seconds=0;
    timerInterval = setInterval(()=>{
        seconds++;
        const mins = String(Math.floor(seconds/60)).padStart(2,'0');
        const secs = String(seconds%60).padStart(2,'0');
        timerEl.textContent = `${mins}:${secs}`;
    },1000);
}
function stopTimer() { clearInterval(timerInterval); timerEl.textContent="00:00"; }

</script>
</body>
</html>
