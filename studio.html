<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach L Radio – Host Studio</title>
<style>
/* ... Keeping your existing styles ... */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:'Segoe UI', sans-serif; background:#000; color:#fff; scroll-behavior:smooth; overflow-y:auto; scroll-snap-type:y mandatory; }

#lockScreen { position:fixed; inset:0; background:radial-gradient(circle at top, #222, #000); display:flex; align-items:center; justify-content:center; z-index:9999; }
.lock-box { background:#111; padding:30px; border-radius:14px; width:90%; max-width:360px; text-align:center; box-shadow:0 0 40px rgba(255,0,0,0.3); }
.lock-box input { width:100%; padding:12px; border-radius:8px; border:none; font-size:16px; margin-top:10px; text-align:center; }
.lock-box button { margin-top:15px; width:100%; padding:12px; border-radius:8px; border:none; background:#e53935; color:#fff; font-size:16px; cursor:pointer; }
.lock-error { margin-top:10px; font-size:0.85rem; color:#ff6666; display:none; }

.top-ui { position:fixed; top:0; left:0; width:100%; z-index:20; background:rgba(0,0,0,0.8); }
header { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
.badge { background:#e53935; padding:6px 12px; border-radius:20px; font-size:0.7rem; font-weight:bold; }

.section { height:100vh; width:100%; scroll-snap-align:start; position:relative; overflow: hidden; }
iframe { width:100%; height:100%; border:none; }

/* RECORDER STYLES */
.studio-container { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#050505; padding: 20px; }
.video-wrap { display: flex; gap: 10px; width: 90%; max-width: 1200px; justify-content: center; }
video { width: 45%; border-radius:12px; background: #111; box-shadow:0 0 20px rgba(255,0,0,0.4); }
.controls-bar { margin-top:20px; display: flex; gap: 10px; }
.controls-bar button { padding: 12px 20px; border: none; border-radius: 8px; background: #e53935; color: #fff; cursor: pointer; font-weight: bold; }
textarea#signalBox { width: 90%; max-width: 600px; height: 60px; margin-top: 15px; background: #111; color: #00ff88; border: 1px solid #333; font-size: 10px; padding: 10px; border-radius: 8px; }

#chatOverlay { position: absolute; right: 20px; bottom: 80px; width: 250px; height: 300px; background: rgba(0,0,0,0.6); border: 1px solid #444; border-radius: 8px; display: flex; flex-direction: column; }
#chatMsgs { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }

#exitBtn { position:fixed; bottom:20px; right:20px; background:#ff3366; color:#fff; padding:10px 18px; border-radius:30px; font-weight:bold; cursor:pointer; z-index:30; }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>🎙️ Coach L Radio Studio</h2>
    <p>Enter access password</p>
    <input type="password" id="pwInput" onkeydown="if(event.key==='Enter') unlockStudio()">
    <button onclick="unlockStudio()">Enter Studio</button>
    <div class="lock-error" id="pwError">Incorrect password</div>
  </div>
</div>

<div class="top-ui">
  <header>
    <h1>🎙️ Coach L Radio – Host Studio</h1>
    <div class="badge">HOST ONLY</div>
  </header>
</div>

<section class="section">
  <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/dj" allow="microphone; autoplay;维持"></iframe>
</section>

<section class="section">
  <div class="studio-container">
    <div class="video-wrap">
        <video id="studioPreview" autoplay playsinline muted></video>
        <video id="guestPreview" autoplay playsinline></video>
    </div>

    <div class="controls-bar">
      <button onclick="startCamera()">1. Open Cam</button>
      <button onclick="createOffer()">2. Live Passkey</button>
      <button onclick="setRemote()">3. Link Guest</button>
      <button onclick="startRecording()" style="background: #00c853;">Start HQ Rec</button>
      <button onclick="stopRecording()" style="background: #333;">Stop</button>
    </div>

    <textarea id="signalBox" placeholder="Connection Code Appears/Pasted Here..."></textarea>
    
    <div id="chatOverlay">
        <div id="chatMsgs"></div>
        <div style="display:flex">
            <input type="text" id="chatIn" style="flex:1; border:none; padding:5px;" placeholder="Reply to all...">
            <button onclick="sendMsg()" style="background:#e53935; border:none; color:#fff; padding:5px;">Send</button>
        </div>
    </div>
  </div>
</section>

<section class="section">
  <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/schedule"></iframe>
</section>

<button id="exitBtn" onclick="exitStudio()">Exit Studio</button>

<script>
const allowedPasswords = ["CoachL2025!","SadeeB","AlexisLove","Mutodi"];
function unlockStudio() {
  const val = document.getElementById("pwInput").value;
  if (allowedPasswords.includes(val)) document.getElementById("lockScreen").style.display = "none";
  else document.getElementById("pwError").style.display = "block";
}
function exitStudio() { window.location.href = "index.html"; }

/* ===== MULTI-USER MEDIA ENGINE ===== */
let localStream, guestStream, peerConnection, dataChannel, mediaRecorder;
let recordedChunks = [];
const studioVid = document.getElementById("studioPreview");
const guestVid = document.getElementById("guestPreview");
const signalBox = document.getElementById("signalBox");

const iceConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { width: 3840, height: 2160, frameRate: 60 },
    audio: { echoCancellation: true, noiseSuppression: true }
  });
  studioVid.srcObject = localStream;
}

function createPeer() {
    peerConnection = new RTCPeerConnection(iceConfig);
    localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
    
    peerConnection.ontrack = (e) => {
        guestStream = e.streams[0];
        guestVid.srcObject = guestStream;
    };

    dataChannel = peerConnection.createDataChannel("chat");
    dataChannel.onmessage = e => addChat("Guest: " + e.data);

    peerConnection.onicecandidate = e => {
        if (!e.candidate) signalBox.value = JSON.stringify(peerConnection.localDescription);
    };
}

async function createOffer() {
    if(!localStream) await startCamera();
    createPeer();
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
}

async function setRemote() {
    const data = JSON.parse(signalBox.value);
    if(data.type === "offer") {
        createPeer();
        await peerConnection.setRemoteDescription(data);
        const ans = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(ans);
        signalBox.value = JSON.stringify(peerConnection.localDescription);
    } else {
        await peerConnection.setRemoteDescription(data);
    }
}

async function startRecording() {
    // MIXING: Grab Studio Mic + Guest Voice
    const audioCtx = new AudioContext();
    const dest = audioCtx.createMediaStreamDestination();
    audioCtx.createMediaStreamSource(localStream).connect(dest);
    if(guestStream) audioCtx.createMediaStreamSource(guestStream).connect(dest);

    const combined = new MediaStream([
        localStream.getVideoTracks()[0],
        dest.stream.getAudioTracks()[0]
    ]);

    // Use your preferred File Picker
    const fileHandle = await window.showSaveFilePicker({ suggestedName: "CoachL_Session.webm" });

    mediaRecorder = new MediaRecorder(combined, {
        mimeType: "video/webm; codecs=vp9",
        videoBitsPerSecond: 25000000 // 25Mbps Ultra HD
    });

    recordedChunks = [];
    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
    mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
    };
    mediaRecorder.start();
}

function stopRecording() { if(mediaRecorder) mediaRecorder.stop(); }

function sendMsg() {
    const val = document.getElementById("chatIn").value;
    if(dataChannel) dataChannel.send(val);
    addChat("Studio: " + val);
    document.getElementById("chatIn").value = "";
}

function addChat(m) {
    const d = document.createElement("div");
    d.textContent = m;
    document.getElementById("chatMsgs").appendChild(d);
}
</script>
</body>
</html>
