<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach L Radio – Ultra Studio</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:#fff; font-family:'Segoe UI', system-ui, sans-serif; overflow-y:auto; scroll-snap-type:y mandatory; }
    
    /* Gated Entry */
    #lockScreen { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:9999; }
    .lock-box { background:#111; padding:40px; border-radius:24px; text-align:center; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .lock-box input { display:block; width:100%; padding:15px; margin:20px 0; background:#222; border:none; color:#fff; border-radius:12px; text-align:center; }
    .lock-box button { width:100%; padding:15px; border-radius:12px; border:none; background:#e53935; color:#fff; font-weight:bold; cursor:pointer; }

    /* Layout */
    .section { height:100vh; width:100%; scroll-snap-align:start; position:relative; overflow:hidden; background:#000; }
    iframe { width:100%; height:100%; border:none; }

    /* Video Player (Section 2) */
    .broadcast-container { position:relative; width:100%; height:100%; background:#050505; display:flex; align-items:center; justify-content:center; }
    
    /* Main Video Feed - Filling the space like Jitsi */
    #mainDisplay { width:100%; height:100%; object-fit: cover; background:#000; transition: transform 0.5s ease; }
    .portrait { object-fit: contain !important; transform: scale(0.9); }

    /* Floating UI Controls */
    .overlay-controls { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:10; background:rgba(0,0,0,0.6); padding:10px 20px; border-radius:50px; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); }
    .overlay-controls button { background:none; border:none; color:#fff; cursor:pointer; font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:1px; padding:10px; transition: 0.2s; }
    .overlay-controls button:hover { color:#ff3366; }
    .rec-active { color:#ff3366 !important; animation: pulse 1.5s infinite; }

    /* Notification Bell & Chat */
    #chatToggle { position:absolute; top:30px; right:30px; font-size:24px; cursor:pointer; z-index:15; background:rgba(229,57,53,0.2); width:50px; height:50px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:0.3s; }
    #chatToggle.has-new::after { content:''; position:absolute; top:12px; right:12px; width:10px; height:10px; background:#00ff88; border-radius:50%; }
    
    #chatPanel { position:absolute; top:90px; right:30px; width:320px; height:450px; background:rgba(15,15,15,0.95); border:1px solid #333; border-radius:16px; display:none; flex-direction:column; z-index:14; backdrop-filter:blur(20px); overflow:hidden; }
    #chatMsgs { flex:1; overflow-y:auto; padding:15px; font-size:14px; line-height:1.6; }
    .chat-input { display:flex; padding:10px; background:#222; }
    .chat-input input { flex:1; background:none; border:none; color:#fff; padding:10px; outline:none; }

    #signalBox { position:absolute; bottom:100px; left:50%; transform:translateX(-50%); width:300px; height:40px; background:rgba(0,0,0,0.8); border:1px solid #444; color:#00ff88; font-size:10px; border-radius:8px; padding:10px; opacity:0.5; transition:0.3s; z-index:5; }
    #signalBox:focus { opacity:1; height:100px; }

    @keyframes pulse { 0% { opacity:1; } 50% { opacity:0.3; } 100% { opacity:1; } }
</style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-box">
        <h2>🎙️ COACH L STUDIO</h2>
        <input type="password" id="pw" placeholder="ACCESS CODE">
        <button onclick="unlock()">ENTER SYSTEM</button>
    </div>
</div>

<section class="section">
    <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/dj" allow="microphone; autoplay"></iframe>
</section>

<section class="section">
    <div class="broadcast-container">
        <div id="chatToggle" onclick="toggleChat()">🔔</div>
        
        <div id="chatPanel">
            <div id="chatMsgs"></div>
            <div class="chat-input">
                <input type="text" id="msgIn" placeholder="Reply to Guest...">
                <button onclick="sendMsg()" style="background:none; border:none; color:#e53935; font-weight:bold;">SEND</button>
            </div>
        </div>

        <video id="mainDisplay" autoplay playsinline muted></video>

        <textarea id="signalBox" placeholder="Connection Passkey..."></textarea>

        <div class="overlay-controls">
            <button onclick="toggleCam()">🔄 Switch Cam</button>
            <button onclick="startBroadcast()">📡 Go Live</button>
            <button onclick="connectGuest()">🔗 Link Guest</button>
            <button id="recBtn" onclick="toggleRec()">⏺ Record</button>
            <button onclick="shareScreen()">🖥 Share Screen</button>
        </div>
    </div>
</section>

<section class="section">
    <iframe src="https://coach-l-radio.duckdns.org/public/coach-l-radio/schedule"></iframe>
</section>

<script>
let localStream, guestStream, peerConnection, dataChannel, mediaRecorder;
let recordedChunks = [];
let currentFacingMode = "user";

const mainDisplay = document.getElementById("mainDisplay");
const chatPanel = document.getElementById("chatPanel");
const chatToggle = document.getElementById("chatToggle");

// 1. UNLOCK LOGIC
function unlock() {
    const p = document.getElementById("pw").value;
    if(["CoachL2025!","SadeeB","AlexisLove","Mutodi"].includes(p)) {
        document.getElementById("lockScreen").style.display = "none";
        initMedia();
    }
}

// 2. CAMERA ENGINE (HD + TOGGLE)
async function initMedia() {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    
    // Auto-detect Orientation for Landscape vs Portrait
    const constraints = {
        video: { 
            facingMode: currentFacingMode,
            width: { ideal: 3840 },
            height: { ideal: 2160 }
        },
        audio: true
    };

    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    mainDisplay.srcObject = localStream;

    // Visual adjustment for Portrait/Landscape
    if (currentFacingMode === "user") mainDisplay.classList.add("portrait");
    else mainDisplay.classList.remove("portrait");
}

function toggleCam() {
    currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
    initMedia();
}

// 3. BROADCAST & GUEST LINKING
function createPeer() {
    peerConnection = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
    
    peerConnection.ontrack = (e) => {
        guestStream = e.streams[0];
        // In a pro setup, we'd overlay the guest, 
        // but for now, we switch the main display to the guest when they talk
        mainDisplay.srcObject = guestStream;
    };

    dataChannel = peerConnection.createDataChannel("chat");
    dataChannel.onmessage = e => {
        addChat("Guest: " + e.data);
        if(chatPanel.style.display !== "flex") chatToggle.classList.add("has-new");
    };

    peerConnection.onicecandidate = e => {
        if(!e.candidate) document.getElementById("signalBox").value = JSON.stringify(peerConnection.localDescription);
    };
}

async function startBroadcast() { createPeer(); const o = await peerConnection.createOffer(); await peerConnection.setLocalDescription(o); }
async function connectGuest() { const d = JSON.parse(document.getElementById("signalBox").value); await peerConnection.setRemoteDescription(d); }

// 4. CHAT SYSTEM
function toggleChat() {
    const isHidden = chatPanel.style.display === "none" || chatPanel.style.display === "";
    chatPanel.style.display = isHidden ? "flex" : "none";
    chatToggle.classList.remove("has-new");
}

function sendMsg() {
    const val = document.getElementById("msgIn").value;
    if(dataChannel) dataChannel.send(val);
    addChat("Studio: " + val);
    document.getElementById("msgIn").value = "";
}

function addChat(m) {
    const d = document.createElement("div");
    d.style.marginBottom = "10px";
    d.textContent = m;
    document.getElementById("chatMsgs").appendChild(d);
}

// 5. RECORDING (HQ + DIRECT DISK)
async function toggleRec() {
    const btn = document.getElementById("recBtn");
    if(mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btn.classList.remove("rec-active");
    } else {
        const handle = await window.showSaveFilePicker({ suggestedName: "CoachL_Radio_HD.webm" });
        mediaRecorder = new MediaRecorder(localStream, { mimeType: "video/webm;codecs=vp9", videoBitsPerSecond: 25000000 });
        recordedChunks = [];
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const blob = new Blob(recordedChunks, {type:"video/webm"});
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            alert("Record Saved");
        };
        mediaRecorder.start();
        btn.classList.add("rec-active");
    }
}
</script>
</body>
</html>
