<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach L Radio – Ultra HD Studio</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { height:100vh; font-family:'Segoe UI', sans-serif; background:#050505; color:#fff; display: flex; }
        
        /* Main Workspace */
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #videoGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 1100px; }
        video { width: 100%; aspect-ratio: 16/9; border-radius: 12px; background: #111; border: 2px solid #333; object-fit: cover; }
        
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: #e53935; color: #fff; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #ff5252; transform: translateY(-2px); }
        button.recording { background: #ff0000; animation: pulse 1.5s infinite; }
        
        /* Sidebar Chat */
        #chatPanel { width: 320px; background: #111; border-left: 1px solid #222; display: flex; flex-direction: column; }
        #chatMessages { flex: 1; overflow-y: auto; padding: 15px; font-size: 0.9rem; }
        .msg { margin-bottom: 8px; line-height: 1.4; }
        .studio-msg { color: #00ff88; }
        .guest-msg { color: #44aaff; }
        #chatInputArea { display: flex; padding: 10px; background: #1a1a1a; }
        #chatInputArea input { flex: 1; padding: 10px; background: #222; border: 1px solid #333; color: white; border-radius: 4px 0 0 4px; }
        
        #status { position: absolute; top: 20px; left: 20px; color: #00ff88; font-family: monospace; }
        textarea { background: #111; color: #aaa; border: 1px solid #333; border-radius: 8px; padding: 10px; font-size: 10px; margin-top: 10px; width: 100%; max-width: 500px;}
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="status">HD LIVE // RECORDING READY</div>

<div class="main-content">
    <div id="videoGrid">
        <video id="localVideo" autoplay playsinline muted title="Studio (You)"></video>
        <video id="remoteVideo" autoplay playsinline title="Guest"></video>
    </div>

    <div class="controls">
        <button onclick="startCamera()">1. Open Camera</button>
        <button onclick="createOffer()">2. Generate Passkey</button>
        <button onclick="setRemote()">3. Connect Guest</button>
        <button id="recBtn" onclick="toggleRecording()">Start High-Bitrate Recording</button>
        <button id="driveBtn" onclick="handleAuthClick()" style="background:#4285F4; display:none;">Save to G-Drive</button>
    </div>

    <div id="timer" style="margin-top:10px; font-size: 1.5rem;">00:00:00</div>
    <textarea id="signalBox" placeholder="Paste Guest Code Here..."></textarea>
</div>

<div id="chatPanel">
    <div id="chatMessages"></div>
    <div id="chatInputArea">
        <input type="text" id="chatInput" placeholder="Message everyone...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
let localStream, guestStream, peerConnection, dataChannel, mediaRecorder;
let recordedChunks = [];
let timerInterval, seconds = 0;
let tokenClient;
let lastVideoBlob;

const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };

// --- 1. MEDIA SETUP ---
async function startCamera() {
    // Setting ideal 4K/HD constraints for best quality
    localStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: 30 } },
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
    });
    document.getElementById("localVideo").srcObject = localStream;
}

// --- 2. WEBRTC (PEER-TO-PEER) ---
function createPeer() {
    peerConnection = new RTCPeerConnection(servers);
    
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = (event) => {
        guestStream = event.streams[0];
        document.getElementById("remoteVideo").srcObject = guestStream;
    };

    // Messaging channel
    dataChannel = peerConnection.createDataChannel("chat");
    dataChannel.onmessage = e => addMessage(e.data, "guest");

    peerConnection.onicecandidate = e => {
        if (!e.candidate) document.getElementById("signalBox").value = JSON.stringify(peerConnection.localDescription);
    };
}

async function createOffer() {
    if(!localStream) await startCamera();
    createPeer();
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
}

async function setRemote() {
    const remoteDesc = JSON.parse(document.getElementById("signalBox").value);
    await peerConnection.setRemoteDescription(remoteDesc);
    if (remoteDesc.type === "offer") {
        createPeer();
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        document.getElementById("signalBox").value = JSON.stringify(peerConnection.localDescription);
    }
}

// --- 3. HIGH QUALITY RECORDING ---
function toggleRecording() {
    const btn = document.getElementById("recBtn");
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btn.classList.remove("recording");
        btn.innerText = "Start High-Bitrate Recording";
        stopTimer();
    } else {
        startRecording();
        btn.classList.add("recording");
        btn.innerText = "STOP RECORDING";
    }
}

async function startRecording() {
    // Audio Mixing (Studio + Guest)
    const audioCtx = new AudioContext();
    const dest = audioCtx.createMediaStreamDestination();
    audioCtx.createMediaStreamSource(localStream).connect(dest);
    if(guestStream) audioCtx.createMediaStreamSource(guestStream).connect(dest);

    // Combine Video + Mixed Audio
    const tracks = [localStream.getVideoTracks()[0], dest.stream.getAudioTracks()[0]];
    const combinedStream = new MediaStream(tracks);

    // Best Video Settings: VP9 codec at 15Mbps (Studio Quality)
    const options = { 
        mimeType: 'video/webm;codecs=vp9,opus',
        videoBitsPerSecond: 15000000 
    };

    mediaRecorder = new MediaRecorder(combinedStream, options);
    recordedChunks = [];
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
        lastVideoBlob = new Blob(recordedChunks, { type: "video/webm" });
        document.getElementById("driveBtn").style.display = "block"; // Show G-Drive button
        const url = URL.createObjectURL(lastVideoBlob);
        const a = document.createElement("a");
        a.href = url; a.download = `CoachL_Radio_${Date.now()}.webm`; a.click(); // Local backup
    };
    
    mediaRecorder.start();
    startTimer();
}

// --- 4. GOOGLE DRIVE UPLOAD ---
// Note: You need a Client ID from Google Cloud Console to use this.
function handleAuthClick() {
    tokenClient.callback = async (resp) => {
        if (resp.error) return;
        uploadToDrive(resp.access_token);
    };
    tokenClient.requestAccessToken();
}

async function uploadToDrive(token) {
    const metadata = { name: `Podcast_${new Date().toISOString()}.webm`, mimeType: 'video/webm' };
    const formData = new FormData();
    formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    formData.append('file', lastVideoBlob);

    fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: new Headers({ 'Authorization': 'Bearer ' + token }),
        body: formData
    }).then(res => res.json()).then(data => alert("Saved to Google Drive!"));
}

// --- UTILS ---
function sendMessage() {
    const input = document.getElementById("chatInput");
    if(!input.value) return;
    const msg = "Studio: " + input.value;
    if(dataChannel) dataChannel.send(msg);
    addMessage(msg, "studio");
    input.value = "";
}

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = `msg ${type}-msg`;
    div.textContent = text;
    const box = document.getElementById("chatMessages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function startTimer() {
    seconds = 0;
    timerInterval = setInterval(() => {
        seconds++;
        let h = Math.floor(seconds/3600).toString().padStart(2,'0');
        let m = Math.floor((seconds%3600)/60).toString().padStart(2,'0');
        let s = (seconds%60).toString().padStart(2,'0');
        document.getElementById("timer").textContent = `${h}:${m}:${s}`;
    }, 1000);
}

function stopTimer() { clearInterval(timerInterval); }

// Initialize Google Auth
window.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com', // REPLACE THIS
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: '', 
    });
};
</script>
</body>
</html>
