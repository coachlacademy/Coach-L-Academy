<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
}

/* ================= HERO BACKGROUND ================= */
.hero {
    position: relative;
    width: 100%;
    height: 100vh;
    background: url('/Coach-L-Academy/les.jpg') center/cover no-repeat;
    animation: heroZoom 20s ease-in-out infinite;
}

/* Soft animated zoom */
@keyframes heroZoom {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

/* Almost completely transparent overlay - Coach L's portrait crystal clear */
.hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at top right, rgba(255,105,180,0.03), transparent 50%),
        radial-gradient(circle at bottom left, rgba(255,105,180,0.02), transparent 50%),
        linear-gradient(to bottom, rgba(5,5,10,0.02), rgba(5,5,10,0.03));
    z-index: 1;
}

/* Floating light sweep - barely visible */
.hero::after {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        120deg,
        transparent 40%,
        rgba(255,105,180,0.02) 50%,
        transparent 60%
    );
    animation: sweep 14s linear infinite;
    z-index: 1;
}

@keyframes sweep {
    0% { transform: translateX(-50%) translateY(-50%); }
    100% { transform: translateX(50%) translateY(50%); }
}

/* ================= CONTENT ================= */
.hero-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    overflow-y: auto;
}

/* Glass card - 80% more transparent, nearly invisible */
.container {
    width: 100%;
    max-width: 480px;
    padding: 40px 35px;
    margin-bottom: 20px;
    border-radius: 30px;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(3px) saturate(180%);
    border: 2px solid rgba(255,255,255,0.4);
    box-shadow:
        0 20px 50px rgba(0,0,0,0.15),
        0 0 90px rgba(255,105,180,0.2),
        inset 0 0 80px rgba(255,255,255,0.03);
}

/* ================= LOGO ================= */
.logo-section {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    width: 110px;
    height: 110px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(255,105,180,0.4), rgba(255,105,180,0.15));
    box-shadow: 0 0 50px rgba(255,105,180,0.5);
}

.logo span {
    font-size: 46px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, #ff69b4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

h1 {
    color: #fff;
    font-size: 30px;
    text-shadow: 
        0 2px 20px rgba(0,0,0,0.9), 
        0 0 40px rgba(0,0,0,0.7),
        0 4px 6px rgba(0,0,0,0.8);
}

.tagline {
    color: rgba(255,255,255,0.95);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 
        0 2px 15px rgba(0,0,0,0.9),
        0 0 30px rgba(0,0,0,0.7);
}

/* ================= PLAYER ================= */
.player {
    background: rgba(255,255,255,0.02);
    border-radius: 22px;
    padding: 25px;
    border: 1px solid rgba(255,255,255,0.25);
}

.status {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}

.dot {
    width: 12px;
    height: 12px;
    background: #ff69b4;
    border-radius: 50%;
    margin-right: 10px;
    animation: blink 2s infinite;
}

@keyframes blink {
    50% { opacity: 0.4; }
}

.controls {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

button {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    font-size: 28px;
    border: 2px solid rgba(255,105,180,0.6);
    background: linear-gradient(135deg, rgba(255,105,180,0.5), rgba(255,105,180,0.25));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 35px rgba(255,105,180,0.6);
    transition: transform .2s;
}

button:hover {
    transform: scale(1.1);
}

.volume {
    display: flex;
    align-items: center;
    gap: 12px;
}

input[type=range] {
    flex: 1;
}

/* ================= NOW PLAYING ================= */
.now {
    margin-top: 20px;
    padding: 18px;
    border-radius: 15px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.25);
}

.now h3 {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.95);
    margin-bottom: 8px;
    text-transform: uppercase;
    text-shadow: 
        0 2px 12px rgba(0,0,0,0.9),
        0 0 25px rgba(0,0,0,0.7);
}

.track {
    color: #fff;
    font-size: 17px;
    text-shadow: 
        0 2px 15px rgba(0,0,0,0.9),
        0 0 30px rgba(0,0,0,0.7);
}

/* ================= CONTEXTUAL MESSAGES ================= */
.context-msg {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.75;
    padding: 13px 15px;
    border-radius: 10px;
    animation: fadeIn 0.7s ease;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0);   }
}
.context-msg.verse {
    color: #ffd97a;
    border-left: 3px solid gold;
    font-style: italic;
}
.context-msg.psychology {
    color: #f0dcff;
    border-left: 3px solid #cc88ff;
}
.context-msg.motivational {
    color: #ffffff;
    border-left: 3px solid #ff69b4;
    font-weight: 600;
}
.context-msg.healing {
    color: #c8fff0;
    border-left: 3px solid #00e5a0;
}

/* ================= BREATHING EXERCISE ================= */
.breath-box {
    margin-top: 16px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}
.breath-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,105,180,0.25);
    border: 2px solid rgba(255,105,180,0.5);
    transition: transform 4s ease-in-out, opacity 4s ease-in-out, background 4s ease;
}
.breath-circle.expand {
    transform: scale(1.9);
    opacity: 1;
    background: rgba(255,105,180,0.5);
}
.breath-circle.hold {
    transform: scale(1.9);
    opacity: 0.75;
}
.breath-circle.contract {
    transform: scale(1);
    opacity: 0.35;
}
.breath-text {
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

/* ================= FOOTER ================= */
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    text-shadow: 
        0 2px 10px rgba(0,0,0,0.9),
        0 0 20px rgba(0,0,0,0.7);
}
</style>
</head>

<body>

<div class="hero">
    <div class="hero-content">

        <div class="container">

            <div class="logo-section">
                <div class="logo"><span>CL</span></div>
                <h1>Coach L Radio</h1>
                <p class="tagline">Inspire · Teach · Heal</p>
            </div>

            <div class="player">
                <div class="status">
                    <span class="dot"></span>
                    <span style="color:#fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">LIVE NOW</span>
                </div>

                <div class="controls">
                    <button id="playBtn" onclick="togglePlay()">▶</button>
                </div>

                <div class="volume">
                    <span>🔊</span>
                    <input type="range" min="0" max="100" value="70" oninput="setVolume(this.value)">
                </div>
            </div>

            <div class="now">
                <h3>NOW PLAYING</h3>
                <div class="track" id="trackInfo">Tap play to connect…</div>
                <div id="contextMsg" class="context-msg" style="display:none"></div>
                <div id="breathBox" class="breath-box">
                    <div id="breathCircle" class="breath-circle"></div>
                    <div id="breathText" class="breath-text">Get comfortable…</div>
                </div>
            </div>

            <div class="footer">
                Streaming 24/7 · Coach L Academy
            </div>

        </div>

    </div>
</div>

<audio id="audio">
    <source src="https://coach-l-radio.duckdns.org/listen/coach-l-radio/radio.mp3" type="audio/mpeg">
</audio>

<script>
// ═══════════════════════════════════════════════════════════════
//  COACH L RADIO – Intelligent Now Playing Engine
// ═══════════════════════════════════════════════════════════════

// ── CONTENT LIBRARIES ─────────────────────────────────────────

var BIBLE_VERSES = [
    '📖 "For I know the plans I have for you," declares the Lord, "plans to prosper you and not to harm you, plans to give you hope and a future." — Jeremiah 29:11',
    '📖 "The Lord is my shepherd; I shall not want. He makes me lie down in green pastures, He leads me beside still waters." — Psalm 23:1–2',
    '📖 "I can do all things through Christ who strengthens me." — Philippians 4:13',
    '📖 "And we know that in all things God works for the good of those who love Him." — Romans 8:28',
    '📖 "Those who hope in the Lord will renew their strength. They will soar on wings like eagles." — Isaiah 40:31',
    '📖 "Be still, and know that I am God." — Psalm 46:10',
    '📖 "In this world you will have trouble. But take heart! I have overcome the world." — John 16:33',
    '📖 "His mercies are new every morning; great is your faithfulness." — Lamentations 3:23',
    '📖 "I praise you, for I am fearfully and wonderfully made." — Psalm 139:14',
    '📖 "Trust in the Lord with all your heart and lean not on your own understanding; in all your ways acknowledge Him." — Proverbs 3:5–6'
];

var PSYCHOLOGY_INSIGHTS = [
    '🧠 Your nervous system doesn\'t know the difference between a memory and the present moment. Healing means teaching your body that it is safe — right now.',
    '🧠 Attachment patterns formed in childhood shape every relationship you enter as an adult. Awareness is the first step to rewriting those patterns.',
    '🧠 The "window of tolerance" is the zone where you can process emotion without being overwhelmed. Breathe. Regulate. Then respond — not react.',
    '🧠 Neuroplasticity means your brain physically rewires with every new thought you choose. You are never too old, too broken, or too far gone to change.',
    '🧠 Unresolved grief doesn\'t disappear — it relocates. It lives in tight shoulders, shallow breathing, and walls you can\'t explain. Your body is telling the story.',
    '🧠 The inner child doesn\'t want to be managed. They want to be seen. What part of you has been waiting for permission to feel safe?',
    '🧠 Cognitive reframing isn\'t toxic positivity. It\'s asking: "What is this moment asking me to grow into?" — and then choosing to answer it.',
    '🧠 Trauma is not what happened to you. It\'s what happened inside you as a result. The wound is real — and so is your capacity to heal it.'
];

var MOTIVATIONAL_MESSAGES = [
    '🔥 You didn\'t come this far to only come this far. Keep going.',
    '🔥 Every setback is a set-up for a comeback only you can write.',
    '🔥 You are not behind. You are on your own timeline — and it\'s divine.',
    '🔥 The version of you that gave up doesn\'t exist. Proof: you\'re still here.',
    '🔥 Start before you\'re ready. Grow while you\'re afraid. That\'s called courage.',
    '🔥 Your breakthrough is not ahead of you — it\'s already inside you, waiting to be activated.',
    '🔥 Stop apologising for taking up space. You were created on purpose, for a purpose.',
    '🔥 Small consistent steps always outrun giant leaps taken in panic. Trust your pace.'
];

var MONDAY_MESSAGES = [
    '💪 It\'s Motivational Monday! This week holds possibilities you haven\'t imagined yet. Walk into it boldly.',
    '💪 Monday is not the enemy — it\'s the universe handing you a blank page. What will you write this week?',
    '💪 Motivational Monday: You reset, you refocus, you rise. This week is entirely yours.',
    '💪 The energy you bring to Monday sets the tone for your entire week. Choose intention over inertia today.'
];

var HEALING_MESSAGES = [
    '💚 You are allowed to rest. Recovery is not weakness — it is the most profound form of strength.',
    '💚 Not every wound needs an audience. Some healing happens in the quiet, when it\'s just you and God.',
    '💚 You survived 100% of your worst days so far. That record still stands.',
    '💚 Boundaries are not walls. They are the loving language of self-respect.',
    '💚 It\'s okay to feel it all — grief, joy, anger, hope — sometimes in the same hour. You\'re human. That\'s sacred.',
    '💚 Your story is not over. The chapter you\'re in just feels long. Turn the page gently.',
    '💚 Forgiveness is not for them. It is freedom — yours to take back whenever you are ready.',
    '💚 Healing is not a destination. It\'s choosing yourself, softly and deliberately, every single day.'
];

// ── CUSTOM TITLE OVERRIDES ─────────────────────────────────────
// 'raw_filename_without_extension': 'Pretty Display Name'
var TITLE_OVERRIDES = {};

// ── STATE ──────────────────────────────────────────────────────
var playing      = false;
var updateInterval = null;
var breathTimeout  = null;
var breathStep     = 0;
var msgToggle      = 0;

// ── DOM REFS ───────────────────────────────────────────────────
var audio        = document.getElementById('audio');
var btn          = document.getElementById('playBtn');
var track        = document.getElementById('trackInfo');
var contextDiv   = document.getElementById('contextMsg');
var breathBox    = document.getElementById('breathBox');
var breathCircle = document.getElementById('breathCircle');
var breathText   = document.getElementById('breathText');

audio.volume = 0.7;

// ── HELPERS ────────────────────────────────────────────────────
function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function cleanTitle(raw) {
    if (!raw) return null;
    var clean = raw.replace(/\.(mp3|wav|aac|flac|ogg|m4a)$/i, '');
    if (TITLE_OVERRIDES[clean]) return TITLE_OVERRIDES[clean];
    if (TITLE_OVERRIDES[raw])   return TITLE_OVERRIDES[raw];
    clean = clean.replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    // Strip trailing IDs / phone numbers (5+ digit standalone number at end)
    clean = clean.replace(/\s+\d{5,}$/, '').trim();
    clean = clean.replace(/\w\S*/g, function(w) {
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    });
    return clean || null;
}

function getShowName() {
    var now  = new Date();
    var day  = now.getDay();   // 0=Sun, 1=Mon … 6=Sat
    var hour = now.getHours();
    if (day === 1)   return 'Motivational Mondays';
    if (hour < 12)   return 'Coach L Morning Show';
    if (hour < 17)   return 'Coach L Afternoon Show';
    if (hour < 20)   return 'Coach L Evening Show';
    return 'Coach L Night Show';
}

// ── CONTEXT ENGINE ─────────────────────────────────────────────
function getContextForTitle(title) {
    var t   = (title || '').toLowerCase();
    var day = new Date().getDay();

    // Prayer / Scripture
    if (t.indexOf('prayer') !== -1 || t.indexOf('word of god') !== -1 ||
        t.indexOf('devotion') !== -1 || t.indexOf('scripture') !== -1 ||
        t.indexOf('bible') !== -1) {
        return { type: 'verse', content: randomFrom(BIBLE_VERSES) };
    }

    // Psychology / Coach L deep content
    if (t.indexOf('coach l') !== -1 || t.indexOf('coaching') !== -1 ||
        t.indexOf('psychology') !== -1 || t.indexOf('mind') !== -1 ||
        t.indexOf('mental') !== -1) {
        return { type: 'psychology', content: randomFrom(PSYCHOLOGY_INSIGHTS) };
    }

    // Commercial / ad break → breathing exercise
    if (t.indexOf('commercial') !== -1 || t.indexOf(' ad ') !== -1 ||
        t.indexOf('sponsor') !== -1 || t.indexOf('break') !== -1 ||
        t.indexOf('radio ad') !== -1 || t.indexOf('advert') !== -1) {
        return { type: 'breathing', content: null };
    }

    // Motivational / Monday
    if (t.indexOf('motivat') !== -1 || t.indexOf('monday') !== -1 || day === 1) {
        return {
            type: 'motivational',
            content: day === 1 ? randomFrom(MONDAY_MESSAGES) : randomFrom(MOTIVATIONAL_MESSAGES)
        };
    }

    // Healing / wellness
    if (t.indexOf('heal') !== -1 || t.indexOf('wellness') !== -1 ||
        t.indexOf('restore') !== -1 || t.indexOf('recovery') !== -1) {
        return { type: 'healing', content: randomFrom(HEALING_MESSAGES) };
    }

    // Time-of-day defaults
    if (t.indexOf('morning') !== -1) {
        return { type: 'motivational', content: randomFrom(MOTIVATIONAL_MESSAGES) };
    }
    if (t.indexOf('afternoon') !== -1 || t.indexOf('evening') !== -1 || t.indexOf('night') !== -1) {
        return { type: 'healing', content: randomFrom(HEALING_MESSAGES) };
    }

    // Fill-in: alternate motivational ↔ healing
    msgToggle++;
    if (msgToggle % 2 === 0) {
        return { type: 'motivational', content: randomFrom(MOTIVATIONAL_MESSAGES) };
    }
    return { type: 'healing', content: randomFrom(HEALING_MESSAGES) };
}

// ── DISPLAY ────────────────────────────────────────────────────
function showContext(ctx) {
    stopBreathing();
    if (ctx.type === 'breathing') {
        contextDiv.style.display = 'none';
        startBreathing();
        return;
    }
    breathBox.style.display = 'none';
    contextDiv.className    = 'context-msg ' + ctx.type;
    contextDiv.textContent  = ctx.content;
    contextDiv.style.display = 'block';
}

function hideContext() {
    stopBreathing();
    contextDiv.style.display = 'none';
    breathBox.style.display  = 'none';
}

// ── BREATHING EXERCISE ─────────────────────────────────────────
var BREATH_STEPS = [
    { label: 'Breathe in…',  cls: 'expand',   ms: 4000 },
    { label: 'Hold…',        cls: 'hold',     ms: 4000 },
    { label: 'Breathe out…', cls: 'contract', ms: 6000 },
    { label: 'Rest…',        cls: '',         ms: 2000 }
];

function runBreathStep() {
    var step = BREATH_STEPS[breathStep % BREATH_STEPS.length];
    breathCircle.className = 'breath-circle ' + step.cls;
    breathText.textContent = step.label;
    breathStep++;
    breathTimeout = setTimeout(runBreathStep, step.ms);
}

function startBreathing() {
    breathBox.style.display = 'flex';
    breathStep = 0;
    runBreathStep();
}

function stopBreathing() {
    if (breathTimeout) { clearTimeout(breathTimeout); breathTimeout = null; }
    breathBox.style.display  = 'none';
    breathStep = 0;
    breathCircle.className   = 'breath-circle';
}

// ── NOW PLAYING API ────────────────────────────────────────────
async function updateNowPlaying() {
    var endpoints = [
        'https://coach-l-radio.duckdns.org/api/nowplaying/coach-l-radio',
        'https://coach-l-radio.duckdns.org/api/nowplaying',
        'https://coach-l-radio.duckdns.org/api/station/1/nowplaying'
    ];

    for (var i = 0; i < endpoints.length; i++) {
        try {
            var response = await fetch(endpoints[i], { headers: { 'Accept': 'application/json' } });
            if (!response.ok) continue;
            var data = await response.json();

            var songInfo = (data.now_playing && data.now_playing.song)
                ? data.now_playing.song
                : (data.song || data.current_song || null);

            if (songInfo) {
                var rawTitle  = songInfo.title || songInfo.text || '';
                var rawArtist = (songInfo.artist || '').trim();
                var title     = cleanTitle(rawTitle) || getShowName();
                track.textContent = rawArtist ? rawArtist + ' – ' + title : title;
                if (playing) showContext(getContextForTitle(rawTitle));
                return;
            }
        } catch (e) { /* try next */ }
    }

    // API unreachable — fall back to time/day show name
    var showName = getShowName();
    track.textContent = showName;
    if (playing) showContext(getContextForTitle(showName));
}

function togglePlay() {
    if (playing) {
        audio.pause();
        btn.textContent = '▶';
        playing = false;
        if (updateInterval) { clearInterval(updateInterval); updateInterval = null; }
        hideContext();
        track.textContent = 'Tap play to connect…';
    } else {
        audio.play().then(function() {
            btn.textContent = '⏸';
            playing = true;
            updateNowPlaying();
            updateInterval = setInterval(updateNowPlaying, 15000);
        }).catch(function() {
            track.textContent = 'Error connecting…';
        });
    }
}

function setVolume(v) {
    audio.volume = v / 100;
}

// Initial load
updateNowPlaying();


</script>

</body>
</html>
